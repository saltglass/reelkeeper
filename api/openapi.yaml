      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tmdbId]
              properties:
                tmdbId: { type: integer }
      responses:
        "200":
          description: Added to the library.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ResolvedTitle" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
