openapi: 3.0.3
info:
  title: Reelkeeper API
  version: "1"
  description: |
    Reelkeeper's native API, used by its own web UI. This file is the source of
    truth: `just gen` generates the Go server types and the TypeScript client
    types from it. Never edit the generated code by hand.

    Authentication: a browser session cookie (after logging in), or an API key
    in the `X-Api-Key` header or the `apikey` query parameter. Requests from
    addresses on the bypass list need neither. Endpoints marked
    `security: []` are open to everyone.

    The Radarr/Sonarr-compatible API under /compat is separate and not
    described here.
servers:
  - url: /api/v1

security:
  - session: []
  - apiKeyHeader: []
  - apiKeyQuery: []

tags:
  - name: auth
  - name: settings
  - name: system
  - name: library
  - name: movies
  - name: series
  - name: indexers
  - name: history
  - name: downloads
  - name: migrate

paths:
  /auth/state:
    get:
      tags: [auth]
      operationId: getAuthState
      summary: What the login page needs to know
      description: |
        Tells the UI whether first-run setup is needed, which login methods
        are on, and whether this request is already signed in.
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthState" }

  /auth/setup:
    post:
      tags: [auth]
      operationId: setup
      summary: Create the first admin account
      description: |
        Only works while no account exists. Signs the new account in.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "204":
          description: Account created and signed in. Sets the session cookie.
        "409":
          description: An account already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/setup/restore:
    post:
      tags: [auth]
      operationId: setupRestore
      summary: Start a new install from a backup instead of a new account
      description: |
        Only works while no account exists (the first-run screen). The request body is
        the backup file (up to 1 GiB). It is checked in full (format, version, secret
        key); then Reelkeeper restarts and restores it before anything else runs, and
        its accounts are the ones to sign in with. The restore is skipped if an account
        has been created in the meantime. Moving between SQLite and Postgres works this
        way: back up, start with the other database and the same REELKEEPER_SECRET_KEY,
        restore.
      security: []
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "202":
          description: Checked and recorded; Reelkeeper is restarting to restore it.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
        "409":
          description: An account already exists.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "413":
          description: Larger than 1 GiB.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Not a usable backup; `message` says why. Code `backup`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in with username and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Credentials" }
      responses:
        "204":
          description: Signed in. Sets the session cookie.
        "401":
          description: Wrong username or password.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "403":
          description: Password login is turned off; use single sign-on.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429": { $ref: "#/components/responses/TooManyRequests" }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Sign out and end the session
      security: []
      responses:
        "204":
          description: Signed out. Clears the session cookie.

  /auth/password:
    put:
      tags: [auth]
      operationId: changePassword
      summary: Change the signed-in account's password
      description: Ends every other session of this account.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordChange" }
      responses:
        "204":
          description: Password changed.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Current password is wrong, or the account signs in through SSO only.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /auth/oidc/login:
    get:
      tags: [auth]
      operationId: oidcLogin
      summary: Start single sign-on
      description: Browser navigation, not an API call. Redirects to the identity provider.
      security: []
      parameters:
        - name: returnTo
          in: query
          description: Path inside Reelkeeper to go back to after signing in.
          schema: { type: string }
      responses:
        "302":
          description: Redirect to the identity provider.
        "404":
          description: Single sign-on is not set up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/oidc/link:
    get:
      tags: [auth]
      operationId: oidcLink
      summary: Link single sign-on to the signed-in account
      description: |
        Browser navigation, not an API call. Requires being signed in with a
        password. Redirects to the identity provider; after signing in there,
        that identity is attached to the current account, so either sign-in
        method reaches the same account. If the identity already belongs to
        an account that only uses single sign-on (created by an earlier
        sign-in), that account is merged into this one and removed.
      parameters:
        - name: returnTo
          in: query
          description: Path inside Reelkeeper to go back to afterwards.
          schema: { type: string }
      responses:
        "302":
          description: Redirect to the identity provider.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403":
          description: Not signed in to an account (API key or bypass).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404":
          description: Single sign-on is not set up.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /auth/oidc/callback:
    get:
      tags: [auth]
      operationId: oidcCallback
      summary: Single sign-on return address
      description: |
        The identity provider sends the browser here. On success, Reelkeeper signs
        the user in (or finishes linking) and redirects into the app. On
        failure it redirects to the login page with an `error` query
        parameter: sso_disabled, sso_expired, sso_denied, sso_failed or
        sso_link_conflict, plus `detail` with the provider's own message when
        it gave one.
      security: []
      parameters:
        - { name: code, in: query, schema: { type: string } }
        - { name: state, in: query, schema: { type: string } }
        - { name: error, in: query, schema: { type: string } }
        - { name: error_description, in: query, schema: { type: string } }
      responses:
        "302":
          description: Redirect into the app, or back to the login page with an error.

  /settings/general:
    get:
      tags: [settings]
      operationId: getGeneralSettings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GeneralSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [settings]
      operationId: putGeneralSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GeneralSettings" }
      responses:
        "200":
          description: Saved. Returns the stored settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GeneralSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /settings/security:
    get:
      tags: [settings]
      operationId: getSecuritySettings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecuritySettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [settings]
      operationId: putSecuritySettings
      description: |
        Saves login and access settings. Refuses changes that would lock
        everyone out, such as turning off password login before single
        sign-on has worked at least once.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SecuritySettingsUpdate" }
      responses:
        "200":
          description: Saved. Returns the stored settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SecuritySettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /settings/security/api-key:
    post:
      tags: [settings]
      operationId: regenerateApiKey
      summary: Replace the API key
      description: The old key stops working immediately. Apps using it (Seerr, the Dashboard) must be updated.
      responses:
        "200":
          description: The new key.
          content:
            application/json:
              schema:
                type: object
                required: [apiKey]
                properties:
                  apiKey: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /settings/security/oidc/check:
    post:
      tags: [settings]
      operationId: checkOidc
      summary: Check that an identity provider is reachable
      description: |
        Fetches the provider's discovery document so mistakes in the issuer
        URL show up before saving. Does not sign anyone in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [issuerUrl]
              properties:
                issuerUrl: { type: string }
      responses:
        "200":
          description: The result of the check (also when it failed).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /system/status:
    get:
      tags: [system]
      operationId: getSystemStatus
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SystemStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /system/tasks:
    get:
      tags: [system]
      operationId: getTasks
      summary: Background tasks and recent runs
      description: |
        Everything System → Tasks shows. Live changes arrive as `task.updated` events.
        Routine runs that found nothing to do (a download check with nothing finished, say)
        are left out of `recent` unless `routine=true`; `hiddenRoutine` says how many were left out.
      parameters:
        - name: routine
          in: query
          required: false
          description: Also list routine runs that found nothing to do. They are hidden by default.
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TasksOverview" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /system/tasks/{kind}/run:
    post:
      tags: [system]
      operationId: runTask
      summary: Run a task now
      description: If the task is already queued or running, that run is returned instead of starting another.
      parameters:
        - { name: kind, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The queued (or already active) run.
          content:
            application/json:
              schema:
                type: object
                required: [job, alreadyActive]
                properties:
                  job: { $ref: "#/components/schemas/Job" }
                  alreadyActive: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No such task.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /system/jobs/{id}/cancel:
    post:
      tags: [system]
      operationId: cancelJob
      summary: Cancel a queued or running task
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204":
          description: Cancelled, or cancelling (a running task stops at its next safe point).
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404":
          description: No such run.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "409":
          description: The run has already finished.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /settings/metadata:
    get:
      tags: [settings]
      operationId: getMetadataSettings
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetadataSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [settings]
      operationId: putMetadataSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MetadataSettingsUpdate" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MetadataSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /settings/metadata/check:
    post:
      tags: [settings]
      operationId: checkMetadata
      summary: Check that the TMDB key works
      description: Uses the key in the body if given, otherwise the stored one.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                tmdbApiKey: { type: string, format: password }
      responses:
        "200":
          description: The result (also when the key doesn't work).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /settings/naming:
    get:
      tags: [settings]
      operationId: getNamingSettings
      summary: Folder and file name templates
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NamingSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [settings]
      operationId: putNamingSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NamingSettings" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NamingSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /settings/naming/preview:
    post:
      tags: [settings]
      operationId: previewNaming
      summary: Show what templates produce for sample movies, without saving
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NamingSettings" }
      responses:
        "200":
          description: Examples, plus a problem per template if any.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NamingPreview" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /settings/labels:
    get:
      tags: [settings]
      operationId: getLabelSettings
      summary: What the quality labels on the Movies page show
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LabelSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [settings]
      operationId: putLabelSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LabelSettings" }
      responses:
        "200":
          description: Saved. Parts come back in display order, without duplicates.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LabelSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /profiles:
    get:
      tags: [library]
      operationId: getProfiles
      summary: Quality profiles
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [library]
      operationId: addProfile
      summary: Add a quality profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "200":
          description: Added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /profiles/options:
    get:
      tags: [library]
      operationId: getProfileOptions
      summary: Everything the quality profile editor needs to draw itself
      description: Presets, features, the source ladder, resolutions, languages and quality names.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileOptions" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /profiles/{id}/settings:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [library]
      operationId: getProfileSettings
      summary: A profile's settings, in simple and compiled form
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /profiles/{id}/settings/simple:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    put:
      tags: [library]
      operationId: putProfileSimpleSettings
      summary: Save simple settings
      description: |
        Also the way back from advanced mode: the profile returns to simple
        mode and the advanced form is discarded. Problems come back as 422
        with field errors keyed `simple.<field>`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileSimple" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /profiles/{id}/settings/advanced:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    put:
      tags: [library]
      operationId: putProfileAdvancedSettings
      summary: Save advanced settings
      description: Puts the profile in advanced mode. A bad form comes back as 422 with a message under the `advanced` field.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileCompiled" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /profiles/{id}/settings/switch-to-advanced:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [library]
      operationId: switchProfileToAdvanced
      summary: Switch a profile to advanced mode
      description: Copies what the simple settings compile to, so the profile behaves exactly as before.
      responses:
        "200":
          description: Switched.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProfileSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /profiles/{id}/test-release:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [library]
      operationId: testRelease
      summary: Try a release name against a profile's saved settings
      description: Nothing is searched or downloaded; only the profile's own rules are checked.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TestReleaseInput" }
      responses:
        "200":
          description: The verdict.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TestReleaseResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /profiles/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    put:
      tags: [library]
      operationId: updateProfile
      summary: Rename a profile or change what it applies to
      description: The slug never changes.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProfileInput" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Profile" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [library]
      operationId: deleteProfile
      summary: Delete a profile
      description: |
        Refused (422, field `profile`) while a media folder or movie uses the
        profile, and for the last remaining profile. Nothing is moved or deleted for you.
      responses:
        "204":
          description: Deleted.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /library/roots:
    get:
      tags: [library]
      operationId: getRootFolders
      summary: Media folders
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RootFolder" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [library]
      operationId: addRootFolder
      summary: Add a media folder and scan it
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RootFolderInput" }
      responses:
        "200":
          description: Added; a scan has been queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RootFolder" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /library/roots/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    put:
      tags: [library]
      operationId: updateRootFolder
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RootFolderUpdate" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RootFolder" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [library]
      operationId: removeRootFolder
      summary: Forget a media folder
      description: Removes what Reelkeeper knows about the folder's movies. Files on disk are never touched.
      responses:
        "204":
          description: Removed.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /library/roots/{id}/scan:
    post:
      tags: [library]
      operationId: scanRootFolder
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
