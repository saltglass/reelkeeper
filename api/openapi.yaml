      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddMovie" }
      responses:
        "200":
          description: Added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MovieDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: That version of the movie is already in the library.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /movies/lookup:
    get:
      tags: [movies]
      operationId: lookupMovies
      summary: Search TMDB for movies to add
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/LookupResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502":
          description: TMDB couldn't be asked (no key, bad key, unreachable).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /movies/bulk:
    post:
      tags: [movies]
      operationId: editMovies
      summary: Change monitoring or upgrades for several movies at once
      description: >-
        Changes every version of the chosen movies, or only their versions with
        `profileId`. Everything is checked first and saved in one go, so a bad
        request changes nothing. Movies this makes wanted (monitoring or upgrades
        turned on) are searched: the first 10 at once, one after another, the rest
        by the hourly search. Turning things off never searches.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MoviesBulkEdit" }
      responses:
        "200":
          description: What was changed and searched.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkEditResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /movies/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [movies]
      operationId: getMovie
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MovieDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [movies]
      operationId: deleteMovie
      summary: Delete a movie from Reelkeeper, and optionally its files
      description: |
        Removes the movie's downloads from the download client, then the movie
        itself. Without `deleteFiles` nothing on disk changes, and the movie's
        folders go on the skip list so scans don't add it back. With it, the
        movie's video files, files named after them, and its folder (if no
        other video is in it) are deleted, but only in media folders with
        "Manage files" on; otherwise nothing at all is deleted (422).
      parameters:
        - { name: deleteFiles, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        "200":
          description: Deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeleteMovieResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: The files can't be deleted (a folder isn't managed by Reelkeeper); `message` says which.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "502":
          description: The download client couldn't remove the movie's downloads. Nothing was deleted.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /skipped-folders:
    get:
      tags: [library]
      operationId: listSkippedFolders
      summary: Folders scans leave alone (from movies deleted with "keep the files")
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SkippedFolder" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /skipped-folders/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    delete:
      tags: [library]
      operationId: unskipFolder
      summary: Let scans see the folder again
      responses:
        "204": { description: Done. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /movies/{id}/refresh:
    post:
      tags: [movies]
      operationId: refreshMovie
      summary: Fetch the latest details from TMDB
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: Refreshed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MovieDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502":
          description: TMDB couldn't be asked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /movies/{id}/rename:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [movies]
      operationId: getMovieRename
      summary: What renaming the movie's files would do (changes nothing)
      responses:
        "200":
          description: The plan, per version. Files already named right are left out.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VersionRename" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [movies]
      operationId: renameMovie
      summary: Rename the movie's files, in media folders Reelkeeper manages only
      responses:
        "200":
          description: The plan with each file's outcome (done, or the problem).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VersionRename" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /movies/{id}/versions/{versionId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      - { name: versionId, in: path, required: true, schema: { type: integer, format: int64 } }
    patch:
      tags: [movies]
      operationId: updateVersion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: Send at least one of the two; one that's left out is unchanged.
              properties:
                monitored: { type: boolean }
                upgrades:
                  type: boolean
                  description: >-
                    Whether Reelkeeper may replace this movie's file with a better release.
                    Off: it keeps the file it has, but still downloads the movie again if the file is missing.
      responses:
        "204":
          description: Saved.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [movies]
      operationId: removeVersion
      summary: Remove a version that has no files
      description: Versions with files can't be removed here, because the next scan would find the files again.
      responses:
        "204":
          description: Removed (and the movie too, if it was the last version).
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The version has files.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /movies/{id}/versions/{versionId}/search:
    post:
      tags: [movies]
      operationId: searchVersion
      summary: Search the indexers for this version now
      description: Queues the search and returns its task. The outcome appears in History. With Grabbing off it still searches and records what it would grab.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: versionId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: The queued (or already queued) search.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /series:
    get:
      tags: [series]
      operationId: getSeriesList
      summary: Every series in the library
      description: The whole list in one response; the UI sorts, filters and searches it.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SeriesSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [series]
      operationId: addSeries
      summary: Add a series by its TMDB ID
      description: Adds the series (or another version of it) to a TV media folder. Nothing is downloaded or created on disk yet.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AddSeries" }
      responses:
        "200":
          description: Added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeriesDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409":
          description: That version of the series is already in the library.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /series/lookup:
    get:
      tags: [series]
      operationId: lookupSeries
      summary: Search TMDB for series to add
      description: A trailing year narrows the search to series that started that year ("Doctor Who 2005").
      parameters:
        - { name: q, in: query, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SeriesLookupResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "502":
          description: TMDB couldn't be asked (no key, bad key, unreachable).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /series/bulk:
    post:
      tags: [series]
      operationId: editSeries
      summary: Change monitoring for several series at once
      description: >-
        Changes every version of the chosen series, or only their versions with
        `profileId`. Everything is checked first and saved in one go, so a bad
        request changes nothing. A `monitor` preset replaces choices made per
        season or episode. Series this makes wanted are searched: the first 10 at
        once, one after another, the rest by the hourly search. Turning things off
        never searches.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SeriesBulkEdit" }
      responses:
        "200":
          description: What was changed and searched.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BulkEditResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /series/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [series]
      operationId: getSeries
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeriesDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [series]
      operationId: updateSeries
      summary: Change how a series is named
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seriesType]
              properties:
                seriesType: { $ref: "#/components/schemas/SeriesType" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeriesDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /series/{id}/refresh:
    post:
      tags: [series]
      operationId: refreshSeries
      summary: Fetch the latest details and episodes from TMDB
      parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: Refreshed; files are re-linked to episodes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeriesDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502":
          description: TMDB couldn't be asked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /series/{id}/orders:
    get:
      tags: [series]
      operationId: getEpisodeOrders
      summary: The episode orders a series could follow, and how well its files fit each
      description: |
        TMDB's aired order plus every alternative order TMDB has for the
        series (DVD, intended, absolute...). For each, how many of the
        series' files would be placed without a problem. Asks TMDB; changes
        nothing.
      parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EpisodeOrder" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502":
          description: TMDB couldn't be asked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /series/{id}/order:
    put:
      tags: [series]
      operationId: setEpisodeOrder
      summary: Choose the episode order a series' files follow
      description: Files are re-linked to episodes by their numbers in the new order. No file is renamed or moved.
      parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [episodeOrder]
              properties:
                episodeOrder:
                  type: string
                  description: An id from the orders list; empty for TMDB's aired order.
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SeriesDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "502":
          description: TMDB couldn't be asked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /series/{id}/rename:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [series]
      operationId: getSeriesRename
      summary: What renaming the series' episode files would do (changes nothing)
      responses:
        "200":
          description: |
            The plan, per version. Files already named right are left out.
            Files Reelkeeper isn't sure about are listed with a problem and are
            never renamed.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VersionRename" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [series]
      operationId: renameSeries
      summary: Rename the series' episode files, in media folders Reelkeeper manages only
      responses:
        "200":
          description: The plan with each file's outcome (done, or the problem).
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/VersionRename" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /series/{id}/versions/{versionId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      - { name: versionId, in: path, required: true, schema: { type: integer, format: int64 } }
    patch:
      tags: [series]
      operationId: updateSeriesVersion
      description: >-
        Changes whether the version is monitored, and/or applies a monitoring
        preset to its episodes. A preset replaces choices made per season or
        episode. When it makes episodes wanted (and TV grabbing isn't off), a
        search is queued.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                monitored: { type: boolean }
                monitor:
                  type: string
                  enum: [all, future, none]
                  description: >-
                    all: every episode, aired or not. future: only episodes airing
                    from today. none: nothing until turned on per season or episode.
      responses:
        "204":
          description: Saved.
        "422": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [series]
      operationId: removeSeriesVersion
      summary: Remove a version that has no files
      description: Versions with files can't be removed here, because the next scan would find the files again.
      responses:
        "204":
          description: Removed (and the series too, if it was the last version).
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: The version has files.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /series/{id}/versions/{versionId}/monitor:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      - { name: versionId, in: path, required: true, schema: { type: integer, format: int64 } }
    post:
      tags: [series]
      operationId: monitorEpisodes
      summary: Turn whole seasons or single episodes on or off for this version
      description: >-
        Overrides the version's preset for these episodes. Seasons are in the
        series' chosen order (0 is Specials). Turning episodes on queues a search
        when any of them has aired (unless TV grabbing is off).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [monitored]
              properties:
                seasons:
                  type: array
                  items: { type: integer }
                episodeIds:
                  type: array
                  items: { type: integer, format: int64 }
                monitored: { type: boolean }
      responses:
        "204":
          description: Saved.
        "422": { $ref: "#/components/responses/ValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /series/{id}/versions/{versionId}/search:
    post:
      tags: [series]
      operationId: searchSeriesVersion
      summary: Search the indexers for this version's wanted episodes now
      description: >-
        Queues the search and returns its task: season packs for mostly-wanted
        finished seasons, single episodes otherwise (at most 10 searches; the
        scheduled pass does the rest). The outcome appears in History. With TV
        grabbing off it still searches and records what it would grab.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
        - { name: versionId, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: The queued (or already queued) search.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Job" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /indexers:
    get:
      tags: [indexers]
      operationId: getIndexers
      summary: Every indexer, with its health and recent activity
      responses:
        "200":
          description: OK, by priority then name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Indexer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [indexers]
      operationId: addIndexer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IndexerInput" }
      responses:
        "200":
          description: Added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Indexer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /indexers/test:
    post:
      tags: [indexers]
      operationId: testIndexerInput
      summary: Check unsaved settings work, without saving them
      description: |
        Logs in if the tracker needs it and looks at its newest releases.
        With id, it tests changes to that indexer: secrets left empty use the
        stored ones.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/IndexerInput" }
                - type: object
                  properties:
                    id: { type: integer, format: int64, description: The indexer being edited, if any. }
      responses:
        "200":
          description: The outcome (ok or not, with a plain-English message).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /indexers/definitions:
    get:
      tags: [indexers]
      operationId: getIndexerDefinitions
      summary: The trackers Reelkeeper has definitions for
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DefinitionList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /indexers/definitions/{id}:
    get:
      tags: [indexers]
      operationId: getIndexerDefinition
      summary: A tracker definition's settings, for the add/edit form
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DefinitionDetail" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /indexers/import/prowlarr/preview:
    post:
      tags: [indexers]
      operationId: previewProwlarrImport
      summary: Read Prowlarr's indexers and show what importing them would do
      description: Read-only calls to Prowlarr's API. Nothing is saved.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProwlarrConnection" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProwlarrPreview" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "502":
          description: Prowlarr couldn't be reached or answered strangely.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /indexers/import/prowlarr:
    post:
      tags: [indexers]
      operationId: importFromProwlarr
      summary: Import chosen indexers from Prowlarr
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: "#/components/schemas/ProwlarrConnection" }
                - type: object
                  required: [ids, useSolverSettings]
                  properties:
                    ids:
                      type: array
                      items: { type: integer }
                      description: Prowlarr indexer ids to import.
                    useSolverSettings:
                      type: boolean
                      description: Also set Reelkeeper's solver address and timeout from Prowlarr's FlareSolverr proxy.
      responses:
        "200":
          description: What was created, and why any weren't.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ProwlarrImportResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }
        "502":
          description: Prowlarr couldn't be reached or answered strangely.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /indexers/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
    get:
      tags: [indexers]
      operationId: getIndexer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Indexer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [indexers]
      operationId: updateIndexer
      description: Secrets left empty (or left out of settings) keep their stored values.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IndexerInput" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Indexer" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }
    delete:
      tags: [indexers]
      operationId: deleteIndexer
      responses:
        "204":
          description: Removed.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /indexers/{id}/test:
    post:
      tags: [indexers]
      operationId: testIndexer
      summary: Check a saved indexer works (the outcome updates its health)
      parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: The outcome.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /indexers/{id}/search:
    post:
      tags: [indexers]
      operationId: searchIndexer
      summary: Search one indexer (for diagnostics)
      description: |
        Reelkeeper searches on its own; there's no search screen (Seerr is where
        people ask for things). This endpoint is for checking an indexer and
        for tests. The search counts towards the indexer's daily limit.
      parameters:
      - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/IndexerQuery" }
      responses:
        "200":
          description: What the indexer found.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/IndexerRelease" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "502":
          description: The indexer failed; the message says why.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /settings/solver:
    get:
      tags: [settings]
      operationId: getSolverSettings
      summary: The Cloudflare solver (FlareSolverr-compatible, such as TRAWL)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SolverSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [settings]
      operationId: putSolverSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SolverSettings" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SolverSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /settings/solver/check:
    post:
      tags: [settings]
      operationId: checkSolver
      summary: Check the solver answers (the given address, or the saved one)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                url: { type: string }
      responses:
        "200":
          description: The outcome.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CheckResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /settings/grabbing:
    get:
      tags: [settings]
      operationId: getGrabbingSettings
      summary: Automatic searching and grabbing
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrabbingSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [settings]
      operationId: putGrabbingSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/GrabbingSettings" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GrabbingSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /settings/backups:
    get:
      tags: [settings]
      operationId: getBackupSettings
      summary: Scheduled backups (System → Backups)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [settings]
      operationId: putBackupSettings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BackupSettings" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /settings/download-client:
    get:
      tags: [settings]
      operationId: getDownloadClient
      summary: The download client connection (never the password)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownloadClient" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [settings]
      operationId: putDownloadClient
      summary: Save the download client connection
      description: |
        Leaving `password` out keeps the stored one, and leaving `type` out keeps the current type. An empty `url` removes the download client (for the built-in client, an empty `folder` does).

        Changing `type` (to or from `builtin` too) moves Reelkeeper's torrents to the new client (the "Move torrents" task, System → Tasks): everything in Activity → Queue
        always moves, and so do torrents still seeding unless `leaveSeeding` is true, in which case those stay in the old client and
        Reelkeeper stops tracking them. The new client checks the files already on disk, so nothing is downloaded again, and nothing is deleted.
        `GET /settings/download-client/move-preview` says what would move. Grabbing, imports and cleanup wait until the move is done.

        A change of `type` (or removing the client) is refused with 422 `move_running` while an earlier move hasn't finished. When there
        are torrents to move and either client can't be reached, it is refused with 422 `download_client` and `message` says why.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DownloadClientUpdate" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownloadClient" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /settings/download-client/move-preview:
    get:
      tags: [settings]
      operationId: getDownloadMovePreview
      summary: What changing the download client would move
      description: |
        Counts the torrents in the current download client that a change of client would move, and lists the ones that couldn't be moved
        and why. It asks the current client, so it needs it to be reachable (`clientError` says if it wasn't). The new client doesn't matter yet.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownloadMovePreview" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /settings/download-client/vpn/check:
    post:
      tags: [settings]
      operationId: checkDownloadClientVpn
      summary: Read a WireGuard config without saving it
      description: |
        Reads a wg-quick style file (what a VPN provider gives you) and says what it contains, with no secret in the answer. Used
        as soon as a file is dropped or pasted, so mistakes show before saving. It makes no connection. A file that can't be used
        is refused with 422 and `fields.config` says why in plain English (a key is never part of the message).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [config]
              properties:
                config: { type: string, description: The text of the WireGuard config file. }
      responses:
        "200":
          description: The config is usable.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VpnSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /settings/download-client/builtin/status:
    get:
      tags: [settings]
      operationId: getBuiltinStatus
      summary: The built-in client's protection, and the address peers see
      description: |
        Where the built-in client's VPN is (`unprotected`, `connecting`, `connected`, `down`, or `held`), and the address the world
        sees, looked up over the computer's own network (`publicIP`) and, while the VPN is connected, through it (`vpnIP`). The
        lookups ask Cloudflare's trace page and are only made when this endpoint is called (the page is open), kept for five minutes,
        and `refresh=true` (the "Check again" button) repeats them at most once in 30 seconds. If both addresses are the same the
        VPN isn't hiding anything: `leak` is true, the state is `down` and downloads are held. 404 when the built-in client isn't
        the download client.
      parameters:
        - { name: refresh, in: query, required: false, schema: { type: boolean }, description: Look the addresses up again now (at most once in 30 seconds). }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuiltinStatus" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /settings/download-client/builtin/start-unprotected:
    post:
      tags: [settings]
      operationId: startBuiltinUnprotected
      summary: Start the built-in client's downloads without a VPN
      description: |
        After the VPN was removed, downloads stay stopped (`vpnHeld`) until this is called. Refused with 422 while a VPN is set up.
        Peers will see the real IP address.
      responses:
        "200":
          description: The saved settings.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DownloadClient" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /settings/download-client/test:
    post:
      tags: [settings]
      operationId: testDownloadClient
      summary: Try a download client connection without saving it
      description: |
        Leaving `password` out uses the stored one. For the built-in client there is nothing to connect to: the test checks that `folder`
        exists and can be written to, and that the port can be opened (unless the built-in client is already listening on it), and
        `version` is the engine's version.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DownloadClientUpdate" }
      responses:
        "200":
          description: Connected.
          content:
            application/json:
              schema:
                type: object
                required: [version]
                properties:
                  version: { type: string, description: The download client's version. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: The values are invalid, or the download client couldn't be reached or refused them. `message` says why in plain English.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /settings/usenet-client:
    get:
      tags: [settings]
      operationId: getUsenetClient
      summary: The Usenet download client connection (never the API key or password)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsenetClient" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [settings]
      operationId: putUsenetClient
      summary: Save the Usenet download client connection
      description: |
        Separate from the torrent client: either, both or neither can be set up. Leaving `apiKey` (SABnzbd) or `password` (NZBGet) out keeps the stored one; changing `type`
        drops the old client's secret. An empty `url` removes the Usenet client; Usenet indexers are then left out of searches.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UsenetClientUpdate" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UsenetClient" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /settings/usenet-client/test:
    post:
      tags: [settings]
      operationId: testUsenetClient
      summary: Try a Usenet client connection without saving it
      description: |
        Leaving `apiKey` or `password` out uses the stored one. Besides connecting, the test reads the client's settings: some only make Reelkeeper work
        less well (`warnings`), others stop it working (the test fails, `message` says what to change).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UsenetClientUpdate" }
      responses:
        "200":
          description: Connected.
          content:
            application/json:
              schema:
                type: object
                required: [version, warnings]
                properties:
                  version: { type: string, description: The Usenet client's version. }
                  warnings:
                    type: array
                    items: { type: string }
                    description: Settings in the Usenet client worth changing, in plain English.
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: The values are invalid, or the Usenet client couldn't be reached or refused them. `message` says why in plain English.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /settings/notifications:
    get:
      tags: [settings]
      operationId: getNotifications
      summary: Emby, Jellyfin, Plex, email and webhook notifications (never the secrets)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [settings]
      operationId: putNotifications
      summary: Save the notification settings
      description: Leaving a secret (`apiKey`, `password`, `secret`) out keeps the stored one; an empty string clears it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NotificationSettingsUpdate" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NotificationSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /settings/notifications/test:
    post:
      tags: [settings]
      operationId: testNotification
      summary: Try one notification channel with the values as typed, without saving
      description: Leaving a secret out uses the stored one.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [channel, settings]
              properties:
                channel: { type: string, enum: [emby, jellyfin, plex, email, webhook] }
                settings: { $ref: "#/components/schemas/NotificationSettingsUpdate" }
      responses:
        "200":
          description: It worked.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string, description: What was reached, in plain English. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: The values are invalid, or the channel failed. `message` says why in plain English.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /history:
    get:
      tags: [history]
      operationId: getHistory
      summary: What Reelkeeper searched for, found and grabbed, newest first
      parameters:
        - { name: titleId, in: query, schema: { type: integer, format: int64 }, description: Only this movie's events. }
        - name: event
          in: query
          description: Only these kinds of event (repeat the parameter for several).
          style: form
          explode: true
          schema:
            type: array
            items: { $ref: "#/components/schemas/HistoryEventKind" }
        - { name: before, in: query, schema: { type: integer, format: int64 }, description: "Paging: only events older than this id (use nextBefore)." }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HistoryPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /wanted:
    get:
      tags: [library]
      operationId: getWanted
      summary: Everything Reelkeeper is still looking for, and why it hasn't found it
      description: >-
        `missing` lists monitored, released movies without a file and aired
        episodes without a file (grouped by series version and season), newest
        first. `upgrades` lists released movies whose file is below their
        profile's "upgrade until" quality (TV never upgrades). Each item says,
        in plain English, where its search stands. With `countsOnly` the lists
        are left empty (and no History is read): the sidebar uses that to stay cheap.
      parameters:
        - { name: countsOnly, in: query, schema: { type: boolean, default: false }, description: Return only the counts. }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WantedList" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /wanted/search:
    post:
      tags: [library]
      operationId: searchWanted
      summary: Search for several movie or series versions now
      description: >-
        Queues one search per version on the task queue (workers run them one
        after another, so they can't swamp an indexer). A version that already has
        a search queued is counted in `alreadyQueued`. Works while Grabbing is off:
        it then records what it would grab.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WantedSearchRequest" }
      responses:
        "200":
          description: How many searches were queued.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WantedSearchResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /wanted/unmonitor:
    post:
      tags: [library]
      operationId: unmonitorWanted
      summary: Stop looking for several movies and episodes
      description: >-
        Turns monitoring off for movie versions and for individual episodes of
        series versions. Nothing is deleted; they can be turned back on from
        their pages. Everything is checked first, so a bad request changes nothing.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WantedUnmonitorRequest" }
      responses:
        "200":
          description: What was turned off.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WantedUnmonitorResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /backfill:
    get:
      tags: [library]
      operationId: getBackfill
      summary: The backfill queue
      description: >-
        Backfill fills in a show's older missing episodes, one show at a time.
        `now` is the show being worked on, `next` the shows waiting (in order)
        and `decision` the finished shows that still have episodes missing
        (less those hidden). `grabsToday` counts the grabs the show in `now`
        has had today, out of `grabsPerDay`.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Backfill" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [library]
      operationId: addBackfill
      summary: Add a series version to the end of the backfill queue
      description: >-
        If nothing is being worked on, the show starts at once: every aired
        episode it has no file for is turned on (specials left out) and the
        Backfill task is run. A show already waiting or being worked on is a
        409. A show that finished earlier can be added again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [versionId]
              properties:
                versionId: { type: integer, format: int64, description: A series version id. }
      responses:
        "201":
          description: Added.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackfillShow" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Already in the queue.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /backfill/{id}:
    delete:
      tags: [library]
      operationId: removeBackfill
      summary: Take a show out of the backfill queue
      description: >-
        Only the queue entry goes: the show's episodes stay as they are.
        Removing the show being worked on starts the next one.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /backfill/{id}/move:
    post:
      tags: [library]
      operationId: moveBackfill
      summary: Move a waiting show up or down the queue
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [direction]
              properties:
                direction: { type: string, enum: [up, down] }
      responses:
        "204": { description: Moved (or already at the end). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /backfill/{id}/hide:
    post:
      tags: [library]
      operationId: hideBackfill
      summary: Take a finished show off the Needs a decision list
      description: Its missing episodes stay wanted.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: Hidden. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /backfill/{id}/options:
    get:
      tags: [library]
      operationId: getBackfillOptions
      summary: Releases the profile turned down, for a show's missing episodes
      description: >-
        Searches the indexers once more for each missing season (as a pack) or
        episode, the same way a search does, and offers up to three releases
        per unit with the most seeders that the profile rejected. Blocklisted
        releases, releases without seeders and releases for the wrong show,
        season or episode are never offered. May take a while. Nothing is
        stored except the short-lived tokens in the answer.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackfillOptions" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /backfill/{id}/grab:
    post:
      tags: [library]
      operationId: grabBackfillOption
      summary: Download one of the offered releases anyway
      description: >-
        Grabs the release behind a `token` from the options, outside the
        profile. It is refused for a media folder with "Manage files" off, too
        little free space, or a blocklisted release. The queue limit
        and backfill's daily quota don't apply, since the user chose it. A
        token expires after 15 minutes (404 `option_expired`); a refusal is a
        409 whose message says why.
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string }
      responses:
        "202":
          description: Sent to the download client.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string, description: What History says about it. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Refused; the message says why.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /migrate/radarr/preview:
    post:
      tags: [migrate]
      operationId: previewRadarrImport
      summary: Read a Radarr and report what bringing it over would do
      description: >
        Only reads Radarr's API; nothing in Reelkeeper or Radarr changes. Radarr's
        movies, tags, history and blocklist are compared with the movies Reelkeeper
        already has in the chosen profile.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RadarrImportRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RadarrImportReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: >
            A field is missing, the profile isn't a movie profile, or Radarr
            couldn't be read. `message` says why in plain English.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /migrate/radarr/import:
    post:
      tags: [migrate]
      operationId: importFromRadarr
      summary: Bring a Radarr's wanted movies, monitoring, tags, history and blocklist over
      description: >
        Radarr is only read. Safe to run again: history and blocklist entries
        are only brought over once. This can take a minute or two for a large
        library (TMDB is asked about each wanted movie), so the request is not
        given a short timeout; it stops only if the browser gives up.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RadarrImportRequest" }
      responses:
        "200":
          description: The same report as the preview, with `imported` true and the counts of what was done.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RadarrImportReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: Same as the preview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /migrate/sonarr/preview:
    post:
      tags: [migrate]
      operationId: previewSonarrImport
      summary: Read a Sonarr and report what bringing it over would do
      description: >
        Only reads Sonarr's API; nothing in Reelkeeper or Sonarr changes. Sonarr's
        series, episodes, tags, history and blocklist are compared with the series
        Reelkeeper already has in the chosen profile. Episodes are matched by season
        and number when their air dates agree, otherwise by air date.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SonarrImportRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SonarrImportReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: >
            A field is missing, the profile isn't a TV profile, or Sonarr
            couldn't be read. `message` says why in plain English.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /migrate/sonarr/import:
    post:
      tags: [migrate]
      operationId: importFromSonarr
      summary: Bring a Sonarr's monitored episodes, tags, history and blocklist over
      description: >
        Sonarr is only read. Safe to run again: history and blocklist entries
        are only brought over once and monitoring is only written where it
        differs. Nothing is searched for; the scheduled pass finds the newly
        wanted episodes a few at a time, and grabs count against the daily
        limit. This can take a minute or two for a large library, so the
        request is not given a short timeout; it stops only if the browser
        gives up.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SonarrImportRequest" }
      responses:
        "200":
          description: The same report as the preview, with `imported` true and the counts of what was done.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SonarrImportReport" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: Same as the preview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /summary:
    get:
      tags: [system]
      operationId: getSummary
      summary: A small snapshot of the queue, upcoming movies and episodes, indexers and grabs, for dashboards
      description: |
        Meant for a homelab dashboard that polls often. It is cheap: it reads
        only Reelkeeper's own records and never asks the download client or any indexer.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DashboardSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /queue:
    get:
      tags: [downloads]
      operationId: getQueue
      summary: Reelkeeper's downloads that aren't finished, with live progress
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Queue" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /queue/{id}/retry-import:
    post:
      tags: [downloads]
      operationId: retryImport
      summary: Try importing a finished download again
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: Imported. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: It still can't be imported; `message` says why.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /queue/{id}/pause:
    post:
      tags: [downloads]
      operationId: pauseDownload
      summary: Pause a download that is still downloading
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: Paused. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: It couldn't be paused; `message` says why (already paused, already finished, or not in the download client any more).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /queue/{id}/resume:
    post:
      tags: [downloads]
      operationId: resumeDownload
      summary: Resume a paused download
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: Resumed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: It couldn't be resumed; `message` says why (not paused, already finished, or not in the download client any more).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /queue/{id}/top:
    post:
      tags: [downloads]
      operationId: moveDownloadToTop
      summary: Move a download to the top of the download client's download queue
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: "Moved. When the download client's own queueing is off there is no queue to reorder, and this changes nothing." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: It couldn't be moved; `message` says why (paused, already finished, or not in the download client any more).
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /queue/{id}/remove:
    post:
      tags: [downloads]
      operationId: removeFromQueue
      summary: Remove a download from the download client, with what it downloaded
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [blocklist, searchAgain]
              properties:
                blocklist: { type: boolean, description: Never grab this release again. }
                searchAgain: { type: boolean, description: "Queue a search for another release. Implies blocklist, or the search would pick the same release again." }
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: It couldn't be removed; `message` says why.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /blocklist:
    get:
      tags: [downloads]
      operationId: getBlocklist
      summary: Releases Reelkeeper skips when it searches, newest first
      description: >
        Temporary entries (releases blocked because a download got stuck) expire
        after 30 days and are not listed once they have; entries you made, and
        releases a tracker deleted, are permanent. An entry is dormant when its
        title has nothing wanted right now; it still blocks, but is only listed
        with `include=dormant`.
      parameters:
        - { name: titleId, in: query, schema: { type: integer, format: int64 }, description: Only this movie's or series' entries. }
        - { name: include, in: query, schema: { type: string, enum: [dormant] }, description: "`dormant` also lists entries of titles with nothing wanted. Without it only the others are listed." }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Blocklist" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /blocklist/{id}:
    delete:
      tags: [downloads]
      operationId: deleteBlocklistItem
      summary: Allow a release to be grabbed again
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer, format: int64 } }
      responses:
        "204": { description: Removed from the blocklist. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /blocklist/unblock-temporary:
    post:
      tags: [downloads]
      operationId: unblockTemporary
      summary: Allow every temporary entry to be grabbed again
      description: >
        Removes the entries that would expire on their own (dormant ones too),
        and keeps the permanent ones. Releases that were stuck may be grabbed,
        and get stuck, again.
      parameters:
        - { name: titleId, in: query, schema: { type: integer, format: int64 }, description: Only this movie's or series' entries. }
      responses:
        "200":
          description: How many entries were removed.
          content:
            application/json:
              schema:
                type: object
                required: [removed]
                properties:
                  removed: { type: integer }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /settings/cleanup:
    get:
      tags: [settings]
      operationId: getCleanupSettings
      summary: What cleanup removes on its own, and when
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CleanupSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    put:
      tags: [settings]
      operationId: putCleanupSettings
      summary: Save the cleanup settings
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CleanupSettings" }
      responses:
        "200":
          description: Saved.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CleanupSettings" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/ValidationError" }

  /cleanup/events:
    get:
      tags: [downloads]
      operationId: getCleanupEvents
      summary: What cleanup removed (or would have), newest first
      parameters:
        - { name: before, in: query, schema: { type: integer, format: int64 }, description: "Paging: only events older than this id (use nextBefore)." }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CleanupEventPage" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /cleanup/seeding:
    get:
      tags: [downloads]
      operationId: getCleanupSeeding
      summary: Imported torrents still in the download client, and what they are waiting for
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/SeedingItem" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /cleanup/orphans:
    get:
      tags: [downloads]
      operationId: getCleanupOrphans
      summary: Things in Reelkeeper's corner of the download client that Reelkeeper doesn't track
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Orphans" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /cleanup/orphans/torrents/{hash}/remove:
    post:
      tags: [downloads]
      operationId: removeOrphanTorrent
      summary: Remove an untracked torrent from the download client, with what it downloaded
      parameters:
        - { name: hash, in: path, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: It couldn't be removed; `message` says why.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /cleanup/orphans/files/remove:
    post:
      tags: [downloads]
      operationId: removeOrphanFile
      summary: Delete a stray file or folder from Reelkeeper's download folder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: A name from the orphans list (no path). }
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422":
          description: It couldn't be deleted; `message` says why.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /backups:
    get:
      tags: [system]
      operationId: listBackups
      summary: The backups in the backup folder, newest first
      description: |
        Each file is read in full once (format, rows and checksum) and the result is
        remembered, also across restarts, so a damaged file shows up with `problem`
        instead of failing the list. `lastRestore` is how the most recent restore went, if one ran.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [system]
      operationId: createBackup
      summary: Make a manual backup now
      description: Synchronous; a backup is a few MB. Old scheduled and manual backups past the number kept are deleted.
      responses:
        "201":
          description: The new backup.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500":
          description: The backup couldn't be made (for example the folder can't be written); `message` says why.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /backups/upload:
    post:
      tags: [system]
      operationId: uploadBackup
      summary: Add a backup made elsewhere
      description: |
        The request body is the backup file itself (up to 1 GiB). It is checked in full
        and saved with an "uploaded" name; it isn't restored until you ask.
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema: { type: string, format: binary }
      responses:
        "201":
          description: The saved backup.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupEntry" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "413":
          description: Larger than 1 GiB.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "422":
          description: Not a usable backup; `message` says why. Code `backup`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500":
          description: It couldn't be saved (for example the folder can't be written); `message` says why.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /backups/{name}:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string }, description: "A backup's file name, such as reelkeeper-20261011-033000-scheduled.backup." }
    get:
      tags: [system]
      operationId: downloadBackup
      summary: Download a backup file
      responses:
        "200":
          description: The file.
          content:
            application/gzip:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      tags: [system]
      operationId: deleteBackup
      summary: Delete a backup file
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /backups/{name}/check:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    post:
      tags: [system]
      operationId: checkBackup
      summary: Check that a backup can be restored here
      description: Reads the whole file (format, checksum, version, secret key) and changes nothing.
      responses:
        "200":
          description: It can be restored; this is what it holds.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BackupCheck" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: It can't be restored here; `message` says why. Code `backup`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /backups/{name}/restore:
    parameters:
      - { name: name, in: path, required: true, schema: { type: string } }
    post:
      tags: [system]
      operationId: restoreBackup
      summary: Restore a backup (Reelkeeper restarts to do it)
      description: |
        Checks the backup, records the request and restarts Reelkeeper after about a second.
        On the way back up, before anything else runs, it saves a safety backup of the current
        data, then replaces everything with this backup. All sign-in sessions end. The outcome
        appears as `lastRestore` in the backup list.
      responses:
        "202":
          description: Accepted; Reelkeeper is about to restart.
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: It can't be restored here; `message` says why. Code `backup`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }

  /images/tmdb/{size}/{file}:
    get:
      tags: [movies]
      operationId: getTmdbImage
      summary: A TMDB poster or backdrop, cached by Reelkeeper
      parameters:
        - name: size
          in: path
          required: true
          schema: { type: string, enum: [w92, w154, w185, w342, w500, w780, w1280, original] }
        - { name: file, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The image.
          content:
            image/jpeg:
              schema: { type: string, format: binary }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /events:
    get:
      tags: [system]
      operationId: streamEvents
      summary: Live updates (Server-Sent Events)
      description: |
        A long-lived `text/event-stream`. Each event's `event:` field is an
        `EventType` and its `data:` is JSON. The UI uses these to refresh
        what's on screen without polling. A comment line is sent every 25s
        so proxies don't close an idle stream.
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/Event" }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    session:
      type: apiKey
      in: cookie
      name: reelkeeper_session
    apiKeyHeader:
      type: apiKey
      in: header
      name: X-Api-Key
    apiKeyQuery:
      type: apiKey
      in: query
      name: apikey

  responses:
    NotFound:
      description: No such item.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Not signed in, and no valid API key.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Too many failed attempts. Try again after the `Retry-After` header's seconds.
      headers:
        Retry-After:
          schema: { type: integer }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ValidationError:
      description: Some fields are invalid. `fields` says which and why.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: Stable machine-readable code, such as `invalid_credentials`.
        message:
          type: string
          description: Plain-English explanation, safe to show to the user.
        fields:
          type: object
          description: For validation errors, the problem with each field, keyed by field path (for example `oidc.issuerUrl`).
          additionalProperties: { type: string }

    AuthState:
      type: object
      required: [setupRequired, localLoginEnabled, oidcEnabled, oidcButtonLabel, authenticated]
      properties:
        setupRequired:
          type: boolean
          description: No account exists yet; the UI shows the first-run setup screen.
        localLoginEnabled: { type: boolean }
        oidcEnabled: { type: boolean }
        oidcButtonLabel:
          type: string
          description: Text for the single sign-on button, such as "Sign in with Authentik".
        authenticated: { type: boolean }
        user: { $ref: "#/components/schemas/User" }
        via:
          type: string
          description: How this request was let in, when authenticated.
          enum: [session, apiKey, bypass]

    User:
      type: object
      required: [id, username, hasPassword, ssoLinked]
      properties:
        id: { type: integer, format: int64 }
        username: { type: string }
        hasPassword:
          type: boolean
          description: False for accounts that only sign in through single sign-on.
        ssoLinked:
          type: boolean
          description: The account can also be reached through single sign-on.

    Credentials:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }

    PasswordChange:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword: { type: string, format: password }
        newPassword: { type: string, format: password }

    LogLevel:
      type: string
      enum: [debug, info, warn, error]

    GeneralSettings:
      type: object
      required: [instanceName, logLevel]
      properties:
        instanceName:
          type: string
          description: Shown in the browser tab and the sidebar. Useful when running more than one Reelkeeper.
        logLevel: { $ref: "#/components/schemas/LogLevel" }

    OidcSettings:
      type: object
      required: [enabled, issuerUrl, clientId, clientSecretSet, scopes, groupsClaim, requiredGroup, buttonLabel]
      properties:
        enabled: { type: boolean }
        issuerUrl:
          type: string
          description: For Authentik, https://auth.example.com/application/o/<app-slug>/
        clientId: { type: string }
        clientSecretSet:
          type: boolean
          description: Whether a client secret is stored. The secret itself is never returned.
        scopes:
          type: array
          items: { type: string }
          description: Always includes openid. Defaults to openid, profile, email.
        groupsClaim:
          type: string
          description: Name of the token claim that lists the user's groups. Authentik uses "groups".
        requiredGroup:
          type: string
          description: If set, only members of this group can sign in.
        buttonLabel: { type: string }
        redirectUrl:
          type: string
          readOnly: true
          description: The address to register with the identity provider. Derived from how Reelkeeper is being reached.
        lastSuccessAt:
          type: string
          format: date-time
          readOnly: true
          description: When someone last signed in through single sign-on. Password login can only be turned off after this is set.

    OidcSettingsUpdate:
      type: object
      required: [enabled, issuerUrl, clientId, scopes, groupsClaim, requiredGroup, buttonLabel]
      properties:
        enabled: { type: boolean }
        issuerUrl: { type: string }
        clientId: { type: string }
        clientSecret:
          type: string
          format: password
          description: Leave out to keep the stored secret. An empty string removes it.
        scopes:
          type: array
          items: { type: string }
        groupsClaim: { type: string }
        requiredGroup: { type: string }
        buttonLabel: { type: string }

    SecuritySettings:
      type: object
      required: [localLoginEnabled, bypassNetworks, trustedProxies, sessionDays, apiKey, oidc]
      properties:
        localLoginEnabled:
          type: boolean
          description: Allow signing in with a username and password.
        bypassNetworks:
          type: array
          items: { type: string }
          description: |
            IP addresses or CIDR ranges that can use Reelkeeper without signing in,
            for example 192.168.1.0/24. Can't include a trusted proxy, because
            everything that comes through the proxy would then skip login.
        trustedProxies:
          type: array
          items: { type: string }
          description: |
            Reverse proxies (IP or CIDR) whose X-Forwarded-For header is
            believed. Requests from anywhere else are judged by their own
            address.
        sessionDays:
          type: integer
          minimum: 1
          maximum: 365
          description: Sign-ins end after this many days without use.
        apiKey:
          type: string
          readOnly: true
          description: Used by Seerr, the Dashboard and scripts.
        oidc: { $ref: "#/components/schemas/OidcSettings" }
        unreadableCredentials:
          type: array
          readOnly: true
          items: { type: string }
          description: |
            Stored credentials that can't be decrypted because the secret key
            changed (for example "oidc.clientSecret" or "apiKey"). Re-enter or
            regenerate them.

    SecuritySettingsUpdate:
      type: object
      required: [localLoginEnabled, bypassNetworks, trustedProxies, sessionDays, oidc]
      properties:
        localLoginEnabled: { type: boolean }
        bypassNetworks:
          type: array
          items: { type: string }
        trustedProxies:
          type: array
          items: { type: string }
        sessionDays: { type: integer, minimum: 1, maximum: 365 }
        oidc: { $ref: "#/components/schemas/OidcSettingsUpdate" }

    ResolvedTitle:
      type: object
      description: The movie or series a reviewed folder turned out to be. Fetch /movies/{id} or /series/{id} for the rest.
      required: [mediaType, id, title, year]
      properties:
        mediaType: { type: string, enum: [movie, series] }
        id: { type: integer, format: int64 }
        title: { type: string }
        year: { type: integer }

    IndexerKind:
      type: string
      enum: [cardigann, torznab, newznab, knaben]
      description: cardigann is a community tracker definition; torznab/newznab a feed (from a tracker, Jackett or another Prowlarr); knaben the Knaben search engine.

    IndexerInput:
      type: object
      required: [name, kind, enabled, settings]
      properties:
        name: { type: string }
        kind: { $ref: "#/components/schemas/IndexerKind" }
        definition: { type: string, description: For cardigann, the definition id. }
        baseUrl:
          type: string
          description: The site's address. For cardigann, empty means the definition's first link; for torznab/newznab, the feed's API address.
        enabled: { type: boolean }
        priority: { type: integer, description: "1 (searched first, preferred) to 50; default 25." }
        useSolver: { type: boolean, description: Send every request through the Cloudflare solver. }
        settings:
          type: object
          additionalProperties: { type: string }
          description: |
            Setting values by name: text as typed, a select's option value,
            a checkbox "true" or "false". For torznab/newznab, the API key is
            "apiKey". Secrets left out or empty keep their stored values.
        categories:
          type: array
          items: { type: integer }
          description: Standard categories to search here; empty means movies (2000) and TV (5000).
        seedRatio: { type: number, description: The tracker's minimum ratio; cleanup never removes a torrent before it's reached. }
        seedTimeMinutes: { type: integer, description: The tracker's minimum seeding time. }
        packSeedTimeMinutes: { type: integer, description: Minimum seeding time for season packs, if different. }
        queryLimit: { type: integer, description: Searches allowed per day; empty for no limit. }
        grabLimit: { type: integer, description: Downloads allowed per day; empty for no limit. }

    Indexer:
      type: object
      required: [id, name, kind, definition, definitionName, baseUrl, enabled, priority, useSolver, settings, secretsSet,
                 categories, health, stats, createdAt]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        kind: { $ref: "#/components/schemas/IndexerKind" }
        definition: { type: string }
        definitionName: { type: string, description: The definition's name ("1337x"); empty if not cardigann or the definition is gone. }
        baseUrl: { type: string }
        enabled: { type: boolean }
        priority: { type: integer }
        useSolver: { type: boolean }
        settings:
          type: object
          additionalProperties: { type: string }
          description: Non-secret setting values. Secrets are never sent back.
        secretsSet:
          type: array
          items: { type: string }
          description: Names of the secrets that are stored (their values are never sent).
        categories:
          type: array
          items: { type: integer }
        seedRatio: { type: number }
        seedTimeMinutes: { type: integer }
        packSeedTimeMinutes: { type: integer }
        queryLimit: { type: integer }
        grabLimit: { type: integer }
        health: { $ref: "#/components/schemas/IndexerHealth" }
        stats: { $ref: "#/components/schemas/IndexerStats" }
        lastSuccessAt: { type: string, format: date-time }
        lastFailureAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }

    IndexerHealth:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [ok, failing, disabled, unknown]
        message: { type: string, description: What's wrong and when Reelkeeper tries again; empty when ok. }
        retryAfter: { type: string, format: date-time, description: Reelkeeper leaves the indexer alone until then. }

    IndexerStats:
      type: object
      required: [queriesToday, grabsToday, queries30d, failures30d, avgMs]
      properties:
        queriesToday: { type: integer }
        grabsToday: { type: integer }
        queries30d: { type: integer }
        failures30d: { type: integer }
        avgMs: { type: integer, description: Average response time over 30 days. }

    DefinitionList:
      type: object
      required: [count, definitions]
      properties:
        count: { type: integer }
        updatedAt: { type: string, format: date-time, description: When the community definitions were last downloaded; absent if never. }
        definitions:
          type: array
          items: { $ref: "#/components/schemas/DefinitionSummary" }

    DefinitionSummary:
      type: object
      required: [id, name, description, type, language, links, custom]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        type:
          type: string
          description: public, semi-private or private.
        language: { type: string }
        links:
          type: array
          items: { type: string }
        custom: { type: boolean, description: The user's own definition. }

    DefinitionDetail:
      type: object
      required: [id, name, description, type, language, links, settings, categories, login]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        type: { type: string }
        language: { type: string }
        links:
          type: array
          items: { type: string }
        settings:
          type: array
          items: { $ref: "#/components/schemas/DefinitionSetting" }
        categories:
          type: array
          description: Standard categories the tracker has.
          items: { $ref: "#/components/schemas/Category" }
        login:
          type: string
          description: How it logs in ("form", "post", "cookie"...), or empty for public trackers.

    DefinitionSetting:
      type: object
      required: [name, label, type, default, options, secret]
      properties:
        name: { type: string }
        label: { type: string }
        type:
          type: string
          description: text, password, checkbox, select, or info (text to show, not a field). Definitions' own info_* types are reported as info; the names info_cookie, info_flaresolverr and info_useragent are standard help texts.
        default: { type: string, description: The starting value ("true"/"false" for checkboxes). For info settings, the text to show (may contain simple HTML). }
        options:
          type: array
          items:
            type: object
            required: [value, label]
            properties:
              value: { type: string }
              label: { type: string }
        secret: { type: boolean, description: Stored encrypted and never sent back. }

    Category:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }

    IndexerQuery:
      type: object
      properties:
        type:
          type: string
          enum: [search, movie-search, tv-search]
        query: { type: string }
        year: { type: integer }
        season: { type: integer }
        episode: { type: string }
        imdbId: { type: string }
        tmdbId: { type: integer }
        tvdbId: { type: integer }
        categories:
          type: array
          items: { type: integer }

    IndexerRelease:
      type: object
      required: [title, guid, size, seeders, leechers, categories, downloadFactor, uploadFactor, indexerId, indexer]
      properties:
        title: { type: string }
        guid: { type: string }
        detailsUrl: { type: string }
        downloadUrl: { type: string }
        magnetUrl: { type: string }
        infoHash: { type: string }
        size: { type: integer, format: int64 }
        seeders: { type: integer }
        leechers: { type: integer }
        grabs: { type: integer }
        publishDate: { type: string, format: date-time }
        categories:
          type: array
          items: { type: integer }
        imdbId: { type: integer }
        tmdbId: { type: integer }
        tvdbId: { type: integer }
        downloadFactor: { type: number, description: 0 is freeleech, 1 normal. }
        uploadFactor: { type: number }
        minimumRatio: { type: number }
        minimumSeedTime: { type: integer, format: int64, description: Seconds. }
        indexerId: { type: integer, format: int64 }
        indexer: { type: string }

    ProwlarrConnection:
      type: object
      required: [url, apiKey]
      properties:
        url: { type: string, description: "Prowlarr's address, e.g. http://192.168.1.21:9696." }
        apiKey: { type: string }

    ProwlarrPreview:
      type: object
      required: [indexers]
      properties:
        solverUrl: { type: string, description: Prowlarr's FlareSolverr proxy address, if it has one. }
        solverTimeoutSeconds: { type: integer }
        indexers:
          type: array
          items: { $ref: "#/components/schemas/ProwlarrCandidate" }

    ProwlarrCandidate:
      type: object
      required: [prowlarrId, name, kind, definition, enabled, useSolver, supported, reason, exists, missingSecrets, notes]
      properties:
        prowlarrId: { type: integer }
        name: { type: string }
        kind: { type: string, description: Reelkeeper's kind, or empty when unsupported. }
        definition: { type: string }
        enabled: { type: boolean }
        useSolver: { type: boolean }
        supported: { type: boolean }
        reason: { type: string, description: Why it can't be imported, when not supported. }
        exists: { type: boolean, description: An Reelkeeper indexer already has this name. }
        missingSecrets:
          type: array
          items: { type: string }
          description: Secrets Prowlarr didn't reveal; enter them after importing.
        notes:
          type: array
          items: { type: string }

    ProwlarrImportResult:
      type: object
      required: [created, skipped]
      properties:
        created:
          type: array
          items: { $ref: "#/components/schemas/Indexer" }
        skipped:
          type: array
          items:
            type: object
            required: [prowlarrId, reason]
            properties:
              prowlarrId: { type: integer }
              reason: { type: string }

    GrabbingSettings:
      type: object
      required: [mode, queueLimit, minSeeders]
      properties:
        mode:
          type: string
          enum: [off, dryrun, on]
          description: "off: no automatic searching. dryrun: search and record what would be grabbed. on: send releases to the download client."
        tvMode:
          type: string
          enum: [off, dryrun, on]
          description: The same choice for TV, separate from movies. Always returned; when saving, leaving it out keeps the current one.
        queueLimit: { type: integer, description: "Most downloads in Activity → Queue, movies and TV together (0 = no limit). Grabbing pauses while the queue is this full; Seerr requests still go through." }
        minSeeders: { type: integer, description: Releases with fewer seeders are skipped. }

    BackupSettings:
      type: object
      required: [folder, scheduled, time, keep]
      properties:
        folder: { type: string, description: "Where backups are kept, an absolute path. Empty: a `backups` folder in Reelkeeper's data folder." }
        scheduled: { type: boolean, description: Make a backup every day. }
        time: { type: string, description: 'When the daily backup runs, "HH:MM" on a 24-hour clock, local time.', example: "03:30" }
        keep: { type: integer, description: How many scheduled and manual backups to keep (1 to 365). Safety and uploaded backups aren't counted. }
        effectiveFolder:
          type: string
          readOnly: true
          description: The folder in use (the setting, or the data folder's `backups`). Returned only; ignored when saving.

    BackupEntry:
      type: object
      required: [name, size, keyMatches]
      description: One backup file. The header fields are absent when `problem` is set.
      properties:
        name: { type: string }
        size: { type: integer, format: int64, description: Bytes. }
        createdAt: { type: string, format: date-time }
        kind: { type: string, description: "scheduled, manual or safety (made just before a restore). A file whose name ends `-uploaded.backup` was uploaded." }
        app: { type: string, description: The Reelkeeper version that made it. }
        engine: { type: string, description: sqlite or postgres. }
        schemaVersion: { type: integer, format: int64 }
        keyMatches: { type: boolean, description: The running secret key opens the credentials stored in this backup. }
        problem: { type: string, description: Why the file can't be used, in plain words. }

    RestoreResult:
      type: object
      required: [at, backup, ok, message]
      properties:
        at: { type: string, format: date-time }
        backup: { type: string, description: The backup that was to be restored. }
        ok: { type: boolean }
        message: { type: string }
        safety: { type: string, description: The safety backup made just before. Restoring it undoes this restore. }

    BackupList:
      type: object
      required: [folder, backups]
      properties:
        folder: { type: string, description: The folder the backups are in. }
        backups:
          type: array
          items: { $ref: "#/components/schemas/BackupEntry" }
        lastRestore:
          allOf: [{ $ref: "#/components/schemas/RestoreResult" }]
          nullable: true

    BackupCheck:
      type: object
      required: [createdAt, app, engine, schemaVersion, kind, rows, total]
      properties:
        createdAt: { type: string, format: date-time }
        app: { type: string }
        engine: { type: string }
        schemaVersion: { type: integer, format: int64 }
        kind: { type: string }
        rows:
          type: object
          description: Rows per table.
          additionalProperties: { type: integer }
        total: { type: integer }

    DownloadClientType:
      type: string
      enum: [qbittorrent, transmission, deluge, builtin]
      description: |
        Which download client it is. Settings saved before there was a choice read as `qbittorrent`. `builtin` is Reelkeeper's own
        torrent client (experimental): it has no address or login, and counts as set up once it has a `folder`.

    DownloadClient:
      type: object
      required: [type, url, username, passwordSet, folder, listenPort, maxActiveDownloads, maxActiveSeeds, downloadLimitKBs, uploadLimitKBs, forwardedPort, hasVpn, vpnHeld, vpn, vpnProblem]
      properties:
        type: { $ref: "#/components/schemas/DownloadClientType" }
        url: { type: string, description: "The client's address: qBittorrent's Web UI, Transmission's RPC address or Deluge's web UI. Empty: no download client. Always empty for the built-in client." }
        username: { type: string, description: Always empty for Deluge, whose web UI has a password only, and for the built-in client. }
        passwordSet: { type: boolean }
        folder: { type: string, description: "Where the client saves Reelkeeper's downloads, as the client sees it. Empty: the client's default folder (for the built-in client, which has none: it isn't set up)." }
        listenPort: { type: integer, description: "Built-in client only (0 for the others): the TCP and UDP port peers connect to. Not used while a VPN is set up (`forwardedPort` is)." }
        maxActiveDownloads: { type: integer, description: "Built-in client only (0 for the others): how many unfinished torrents download at once; the others wait as Queued." }
        maxActiveSeeds: { type: integer, description: "Built-in client only: how many finished torrents upload at once; 0 is no limit." }
        downloadLimitKBs: { type: integer, description: "Built-in client only: download speed limit in KB/s; 0 is no limit." }
        uploadLimitKBs: { type: integer, description: "Built-in client only: upload speed limit in KB/s; 0 is no limit." }
        forwardedPort: { type: integer, description: "Built-in client with a VPN only: the port the VPN provider forwards to it so peers can connect; 0 means outgoing connections only." }
        hasVpn: { type: boolean, description: "Built-in client only: a WireGuard VPN is set up (its config is stored encrypted and never sent). True also when the stored config can't be read, see `vpnProblem`." }
        vpnHeld: { type: boolean, description: "Built-in client only: the VPN was removed and downloads stay stopped until `POST /settings/download-client/builtin/start-unprotected`." }
        vpn: { allOf: [{ $ref: "#/components/schemas/VpnSummary" }], nullable: true, description: "What the stored VPN config contains, without any secret; null without a VPN." }
        vpnProblem: { type: string, nullable: true, description: "Set when a VPN is stored but can't be used (for example its encryption key changed). Downloads are held meanwhile." }

    VpnSummary:
      type: object
      required: [endpoint, tunnelAddresses, dns, dnsDefault, publicKey, keepalive, mtu, hasPresharedKey, warnings, notes]
      properties:
        endpoint: { type: string, description: "The VPN server, as host:port." }
        tunnelAddresses: { type: array, items: { type: string }, description: "This computer's addresses inside the VPN, such as 10.2.0.2/32." }
        dns: { type: array, items: { type: string }, description: "The DNS servers names are looked up with, through the VPN." }
        dnsDefault: { type: boolean, description: "The config names no DNS server, so 1.1.1.1 is asked (through the VPN)." }
        publicKey: { type: string, description: "This side's public key, worked out from the private key: what the VPN provider has on file. The private key is never shown." }
        keepalive: { type: integer, description: "Seconds between keepalive packets (25 when the config doesn't say)." }
        mtu: { type: integer }
        hasPresharedKey: { type: boolean }
        warnings:
          type: array
          items: { type: string }
          description: "Things worth knowing that don't stop the config working, such as a config that only sends some traffic through the VPN (Reelkeeper sends all of the built-in client's traffic through it anyway)."
        notes:
          type: array
          items: { type: string }
          description: "Settings in the file that were ignored or changed."

    BuiltinStatus:
      type: object
      required: [state, message, since, lastHandshake, endpoint, tunnelAddresses, dns, dnsDefault, rxBytes, txBytes, forwardedPort, publicIP, publicIPError, vpnIP, vpnIPError, leak, checkedAt]
      properties:
        state:
          type: string
          enum: [unprotected, connecting, connected, down, held]
          description: |
            `unprotected`: no VPN, peers see the real IP. `connecting`: the VPN is coming up, nothing runs yet. `connected`: the VPN is up.
            `down`: the VPN dropped (no handshake for 3 minutes) or leaks; every torrent is stopped. `held`: the VPN was removed (or can't be used)
            and downloads are stopped until the person starts them without one.
        message: { type: string, description: "Plain-English detail for the state; empty when there is nothing to add." }
        since: { type: string, format: date-time, nullable: true, description: "When the VPN got into this state." }
        lastHandshake: { type: string, format: date-time, nullable: true, description: "When the VPN server last answered." }
        endpoint: { type: string, description: "The VPN server, host:port; empty without a VPN." }
        tunnelAddresses: { type: array, items: { type: string } }
        dns: { type: array, items: { type: string } }
        dnsDefault: { type: boolean }
        rxBytes: { type: integer, format: int64, description: "Bytes received through the VPN since it started." }
        txBytes: { type: integer, format: int64 }
        forwardedPort: { type: integer }
        publicIP: { allOf: [{ $ref: "#/components/schemas/ObservedIp" }], nullable: true, description: "The address the computer's own network shows the world (looked up directly)." }
        publicIPError: { type: string, description: "Why that lookup failed; empty otherwise." }
        vpnIP: { allOf: [{ $ref: "#/components/schemas/ObservedIp" }], nullable: true, description: "The address peers would see through the VPN; only looked up while it is connected." }
        vpnIPError: { type: string }
        leak: { type: boolean, description: "The VPN shows the same address as the computer, so it isn't hiding anything. Downloads are held." }
        checkedAt: { type: string, format: date-time, nullable: true, description: "When the addresses were last looked up." }

    ObservedIp:
      type: object
      required: [ip, country]
      properties:
        ip: { type: string }
        country: { type: string, description: "Two-letter country code, or empty." }

    UsenetClientType:
      type: string
      enum: [sabnzbd, nzbget]
      description: Which Usenet client it is.

    UsenetClient:
      type: object
      required: [type, url, username, apiKeySet, passwordSet]
      properties:
        type: { $ref: "#/components/schemas/UsenetClientType" }
        url: { type: string, description: "The client's address, like http://192.168.1.20:8080 (SABnzbd) or http://192.168.1.20:6789 (NZBGet). Empty: no Usenet client." }
        username: { type: string, description: "NZBGet's username (its ControlUsername); empty for SABnzbd." }
        apiKeySet: { type: boolean, description: "SABnzbd's API key is stored." }
        passwordSet: { type: boolean, description: "NZBGet's password is stored." }

    UsenetClientUpdate:
      type: object
      required: [url]
      properties:
        type: { $ref: "#/components/schemas/UsenetClientType" }
        url: { type: string }
        username: { type: string, description: "NZBGet only (required for it): its ControlUsername. SABnzbd has none; whatever is sent for it is ignored." }
        apiKey: { type: string, format: password, description: "SABnzbd's API key (Config → General → Security). Leave out to keep the stored one." }
        password: { type: string, format: password, description: "NZBGet's password (Settings → Security → ControlPassword). Leave out to keep the stored one." }

    DownloadClientUpdate:
      type: object
      required: [url, username]
      properties:
        type: { $ref: "#/components/schemas/DownloadClientType" }
        url: { type: string }
        username: { type: string, description: Required for qBittorrent. Transmission's login is optional, so it may be empty. Deluge has no username; whatever is sent for it is ignored. }
        password: { type: string, format: password, description: Leave out to keep the stored password. }
        folder: { type: string, description: "Download folder as the client sees it (an absolute path), or empty for the client's default. Required by the built-in client (it must exist and be writable)." }
        listenPort: { type: integer, minimum: 1024, maximum: 65535, description: "Built-in client only. Leaving it out keeps the current value (6881 at first)." }
        maxActiveDownloads: { type: integer, minimum: 1, maximum: 50, description: "Built-in client only. Leaving it out keeps the current value (3 at first)." }
        maxActiveSeeds: { type: integer, minimum: 0, maximum: 10000, description: "Built-in client only; 0 is no limit. Leaving it out keeps the current value (25 at first)." }
        downloadLimitKBs: { type: integer, minimum: 0, description: "Built-in client only: KB/s, 0 for no limit. Leaving it out keeps the current value." }
        uploadLimitKBs: { type: integer, minimum: 0, description: "Built-in client only: KB/s, 0 for no limit. Leaving it out keeps the current value." }
        vpnConfig:
          type: string
          format: password
          description: |
            Built-in client only: the text of a WireGuard config. Leaving it out keeps the current one; a config replaces it (a config that
            can't be used is refused with a plain-English `fields.vpnConfig`); an empty string removes the VPN, which also needs
            `confirmUnprotected: true`. The config is stored encrypted and never sent back.
        forwardedPort: { type: integer, minimum: 0, maximum: 65535, description: "Built-in client with a VPN only: the port the VPN provider forwards to it (0: none). Leaving it out keeps the current value." }
        confirmUnprotected:
          type: boolean
          description: |
            Required (else 422 with `fields.confirmUnprotected`) to remove a VPN: peers will then see the real IP, and the built-in client's downloads stay
            stopped (`vpnHeld`) until `POST /settings/download-client/builtin/start-unprotected`.
        leaveSeeding:
          type: boolean
          description: |
            Only when `type` changes (left out means false). True leaves the torrents that are still seeding in the old client (Reelkeeper stops tracking them,
            as before 1.3); false moves them too. Torrents in Activity → Queue always move. Leaving them in the built-in client stops them
            seeding, because that client stops when it is no longer the download client.

    DownloadMoveProblem:
      type: object
      required: [release, reason, seeding]
      properties:
        release: { type: string }
        reason: { type: string, description: Why it can't move, in plain English. }
        seeding: { type: boolean, description: True when it is seeding (not in the Queue). }

    DownloadMovePreview:
      type: object
      required: [total, downloading, seeding, cannotMove]
      properties:
        total: { type: integer, description: "Every torrent a change would move (`downloading` + `seeding`)." }
        downloading: { type: integer, description: Torrents in Activity → Queue (still downloading, or finished and waiting to be imported). They always move. }
        seeding: { type: integer, description: Torrents imported and still seeding. The user may leave them in the old client. }
        cannotMove:
          type: array
          description: Torrents counted above that would stay where they are. A seeding one keeps seeding there; one in the Queue is stopped and searched for again.
          items: { $ref: "#/components/schemas/DownloadMoveProblem" }
        clientError: { type: string, description: Set when the current client couldn't be asked, so `cannotMove` may be incomplete. }

    NotificationSettings:
      type: object
      required: [emby, jellyfin, plex, email, webhook]
      properties:
        emby: { $ref: "#/components/schemas/MediaServerNotify" }
        jellyfin: { $ref: "#/components/schemas/MediaServerNotify" }
        plex:
          allOf: [{ $ref: "#/components/schemas/MediaServerNotify" }]
          description: Plex's `apiKeySet` says whether its token (X-Plex-Token) is stored.
        email:
          type: object
          required: [enabled, host, port, username, passwordSet, from, to]
          properties:
            enabled: { type: boolean }
            host: { type: string }
            port: { type: integer, description: "465 uses TLS straight away; other ports upgrade with STARTTLS." }
            username: { type: string }
            passwordSet: { type: boolean }
            from: { type: string }
            to: { type: string }
        webhook:
          type: object
          required: [enabled, url, secretSet]
          properties:
            enabled: { type: boolean }
            url: { type: string }
            secretSet: { type: boolean }

    MediaServerNotify:
      type: object
      description: Emby, Jellyfin or Plex, told about each new, changed or deleted movie or show folder so it shows up without a full library scan.
      required: [enabled, url, apiKeySet, pathFrom, pathTo]
      properties:
        enabled: { type: boolean }
        url: { type: string, description: "The server's address, like http://192.168.1.30:8096." }
        apiKeySet: { type: boolean }
        pathFrom: { type: string, description: "A folder as Reelkeeper sees it, such as /media. Empty with pathTo: paths are the same." }
        pathTo: { type: string, description: "The same folder as the server sees it, such as /Volumes/Media." }

    MediaServerNotifyUpdate:
      type: object
      required: [enabled, url]
      properties:
        enabled: { type: boolean }
        url: { type: string }
        apiKey: { type: string, format: password, description: Leave out to keep the stored key. }
        pathFrom: { type: string }
        pathTo: { type: string }

    NotificationSettingsUpdate:
      type: object
      required: [emby, jellyfin, plex, email, webhook]
      properties:
        emby: { $ref: "#/components/schemas/MediaServerNotifyUpdate" }
        jellyfin: { $ref: "#/components/schemas/MediaServerNotifyUpdate" }
        plex:
          allOf: [{ $ref: "#/components/schemas/MediaServerNotifyUpdate" }]
          description: Plex's `apiKey` is its token (X-Plex-Token).
        email:
          type: object
          required: [enabled, host, port, from, to]
          properties:
            enabled: { type: boolean }
            host: { type: string }
            port: { type: integer }
            username: { type: string }
            password: { type: string, format: password, description: Leave out to keep the stored password. }
            from: { type: string }
            to: { type: string }
        webhook:
          type: object
          required: [enabled, url]
          properties:
            enabled: { type: boolean }
            url: { type: string }
            secret: { type: string, format: password, description: Leave out to keep the stored secret. }

    CleanupSettings:
      type: object
      required: [mode, seedRatio, seedHours, stalledHours, slowKBps, slowHours, metadataHours, importFailedDays, unregistered, missingFiles, emptyReplacedDays]
      description: Every number's 0 turns that rule off.
      properties:
        mode:
          type: string
          enum: [off, dryrun, on]
          description: "off: nothing. dryrun: record what would be removed. on: remove."
        seedRatio: { type: number, format: double }
        seedHours: { type: integer }
        stalledHours: { type: integer }
        slowKBps: { type: integer }
        slowHours: { type: integer }
        metadataHours: { type: integer }
        importFailedDays: { type: integer }
        unregistered: { type: boolean }
        missingFiles: { type: boolean }
        emptyReplacedDays: { type: integer }
        keepFreeGB:
          type: integer
          description: |
            Space to keep free on the download disk, in GB (0: off). Grabs that wouldn't fit
            are skipped; when the disk is lower, imported torrents whose tracker minimum is
            met are removed early, longest finished first. Left out of a save: unchanged.

    CleanupEvent:
      type: object
      required: [id, createdAt, movie, releaseTitle, action, rule, message]
      properties:
        id: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        movie: { allOf: [{ $ref: "#/components/schemas/MovieRef" }], nullable: true }
        releaseTitle: { type: string }
        action: { type: string, enum: [removed, would-remove, emptied, would-empty] }
        rule: { type: string, description: "seeded, stalled, slow, metadata, unregistered, missing, import-failed or replaced-files." }
        message: { type: string }

    CleanupEventPage:
      type: object
      required: [events, nextBefore]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/CleanupEvent" }
        nextBefore: { type: integer, format: int64, nullable: true, description: Pass as `before` for the next page; null when there are no more. }

    TorrentState:
      type: string
      description: |
        What a torrent is doing, in Reelkeeper's own words, the same whichever download client reports it.
        `downloading`; `stalled` (no peers sending); `metadata` (getting the torrent's details); `queued` (waiting in the client's queue);
        `paused` (stopped by someone, not finished); `checking` (the client is checking or preparing its files); `moving` (the client is moving its files);
        `seeding` (finished and sharing, or waiting its turn to); `seeding-stalled` (finished, nobody to share with);
        `seeding-paused` (finished and stopped); `error`; `missing-files` (the client can't find its files);
        `unknown` (a state Reelkeeper doesn't recognise).
        Usenet jobs use the same words where they mean the same (`downloading`, `queued`, `paused`, `checking`, `moving`), plus their own:
        `repairing` (downloaded; checking the files and repairing missing pieces), `unpacking`, `completed` (finished, nothing to seed)
        and `failed` (the Usenet client gave up on it; `message` says why).
      enum: [downloading, stalled, metadata, queued, paused, checking, moving, seeding, seeding-stalled, seeding-paused, error, missing-files, unknown, repairing, unpacking, completed, failed]

    SeedingTorrent:
      type: object
      required: [ratio, seedingTimeSeconds, state, size]
      properties:
        ratio: { type: number, format: double }
        seedingTimeSeconds: { type: integer, format: int64 }
        state: { $ref: "#/components/schemas/TorrentState" }
        size: { type: integer, format: int64 }

    SeedingItem:
      type: object
      required: [downloadId, movie, mediaType, episodes, releaseTitle, indexer, quality, importedAt, seedRatio, seedTimeMinutes, torrent, waiting]
      properties:
        downloadId: { type: integer, format: int64 }
        movie: { allOf: [{ $ref: "#/components/schemas/MovieRef" }], nullable: true, description: The movie or series; null if it's gone from Reelkeeper. }
        mediaType: { type: string, enum: [movie, series] }
        episodes: { type: string, description: 'For a TV download, the episodes it was for; empty for movies.' }
        releaseTitle: { type: string }
        indexer: { type: string }
        quality: { type: string }
        importedAt: { type: string, format: date-time, nullable: true }
        seedRatio: { type: number, format: double, nullable: true, description: The tracker's minimum ratio. }
        seedTimeMinutes: { type: integer, nullable: true, description: The tracker's minimum seed time. }
        torrent: { allOf: [{ $ref: "#/components/schemas/SeedingTorrent" }], nullable: true, description: Null if the download client doesn't have it. }
        waiting: { type: string, description: What cleanup waits for before removing it, in words. Empty when nothing. }

    OrphanTorrent:
      type: object
      required: [hash, name, size, progress, state]
      properties:
        hash: { type: string }
        name: { type: string }
        size: { type: integer, format: int64 }
        progress: { type: number, format: double }
        state: { $ref: "#/components/schemas/TorrentState" }

    Orphans:
      type: object
      required: [torrents, files, folder, clientError]
      properties:
        torrents:
          type: array
          items: { $ref: "#/components/schemas/OrphanTorrent" }
        files:
          type: array
          items: { type: string }
        folder: { type: string, nullable: true, description: Reelkeeper's download folder; null when none is set. }
        clientError: { type: string, nullable: true, description: Why the download client couldn't be asked. }

    MovieRef:
      type: object
      required: [id, title, year]
      properties:
        id: { type: integer, format: int64 }
        title: { type: string }
        year: { type: integer }

    QueueTorrent:
      type: object
      description: What the download client says about the torrent right now.
      required: [state, progress, size, left, speed, etaSeconds, seeds, peers]
      properties:
        state: { $ref: "#/components/schemas/TorrentState" }
        progress: { type: number, format: double, description: 0 to 1. }
        size: { type: integer, format: int64 }
        left: { type: integer, format: int64 }
        speed: { type: integer, format: int64, description: Bytes per second. }
        etaSeconds: { type: integer, nullable: true, description: Null when unknown. }
        seeds: { type: integer, description: Seeds the download client is connected to right now. }
        swarmSeeds: { type: integer, description: "Seeds the tracker reports in the whole swarm; 0 when unknown." }
        peers: { type: integer }
        message: { type: string, description: "What the client says about it, when it says something: an error (Deluge), why a Usenet job failed, or what post-processing is doing (\"Repairing: 68%\")." }

    QueueItem:
      type: object
      required: [id, createdAt, movie, mediaType, episodes, versionId, profile, releaseTitle, indexer, quality, score, size, upgrade, status, message, torrent, movingTo, protocol]
      properties:
        id: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        protocol: { type: string, enum: [torrent, usenet], description: "A Usenet download is in the Usenet client (`torrent` then describes its job there)." }
        movie: { allOf: [{ $ref: "#/components/schemas/MovieRef" }], nullable: true, description: The movie or series; null if it's gone from Reelkeeper. }
        mediaType: { type: string, enum: [movie, series] }
        episodes: { type: string, description: 'For a TV download, the episodes it''s for ("S02E05", "season 2 (8 wanted episodes)"); empty for movies.' }
        versionId: { type: integer, format: int64, nullable: true }
        profile: { type: string, nullable: true, description: The quality profile of the version. }
        releaseTitle: { type: string }
        indexer: { type: string }
        quality: { type: string }
        score: { type: integer }
        size: { type: integer, format: int64 }
        upgrade: { type: boolean }
        status: { type: string, enum: [downloading, import-failed] }
        message: { type: string }
        torrent: { allOf: [{ $ref: "#/components/schemas/QueueTorrent" }], nullable: true, description: Null if the download client (or, for Usenet, the Usenet client) doesn't have it. }
        movingTo: { type: string, nullable: true, description: 'The name of the download client it is moving to ("Transmission"), while a move runs; null otherwise. Its buttons are refused meanwhile.' }

    UpcomingMovie:
      type: object
      required: [titleId, title, year, kind, date]
      properties:
        titleId: { type: integer, format: int64 }
        title: { type: string }
        year: { type: integer }
        kind:
          type: string
          enum: [in cinemas, digital, physical]
          description: Which release date this is.
        date: { type: string, description: "The release date, YYYY-MM-DD." }

    UpcomingEpisode:
      type: object
      required: [titleId, title, season, episode, name, date]
      properties:
        titleId: { type: integer, format: int64, description: The series. }
        title: { type: string, description: The series' title. }
        season: { type: integer }
        episode: { type: integer }
        name: { type: string, description: "The episode's title (may be empty)." }
        date: { type: string, description: "The air date, YYYY-MM-DD." }

    DashboardSummary:
      type: object
      required: [queue, upcoming, upcomingEpisodes, indexers, grabs]
      properties:
        queue:
          type: object
          description: Downloads in progress or waiting for attention (what Activity → Queue lists).
          required: [movies, tv, needsAttention, limit, full]
          properties:
            movies: { type: integer, description: Movie downloads. }
            tv: { type: integer, description: TV downloads (a season pack counts once). }
            needsAttention: { type: integer, description: How many of those finished downloading but couldn't be imported. }
            limit: { type: integer, description: The queue limit in Settings → Download Client (0 = no limit). }
            full: { type: boolean, description: Grabbing is On for movies or TV and the queue is at or over the limit, so nothing new is grabbed automatically. }
        upcoming:
          type: array
          description: Movies Reelkeeper is waiting for that release in the next 7 days (today included), earliest first, at most 10.
          items: { $ref: "#/components/schemas/UpcomingMovie" }
        upcomingEpisodes:
          type: array
          description: Episodes Reelkeeper wants that air in the next 7 days (today included), earliest first, at most 10.
          items: { $ref: "#/components/schemas/UpcomingEpisode" }
        indexers:
          type: object
          description: Only indexers that are turned on are counted.
          required: [ok, total, failing]
          properties:
            ok: { type: integer, description: Indexers that aren't failing. }
            total: { type: integer }
            failing:
              type: array
              description: Names of the failing indexers.
              items: { type: string }
        grabs:
          type: object
          required: [today, limit, mode]
          properties:
            today: { type: integer, description: Releases grabbed since midnight (server time). }
            limit: { type: integer, description: "Deprecated: there's no daily limit any more; always 0. See queue.limit." }
            mode:
              type: string
              enum: [off, dryrun, on]
              description: The Grabbing mode, as in Settings → Grabbing.

    Queue:
      type: object
      required: [items, clientError, clientName, usenetClientName, limit, full, builtinState, diskShort]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/QueueItem" }
        usenetClientName: { type: string, nullable: true, description: "The Usenet client's name (SABnzbd) when one is set up; Usenet items are in it. Null when none is." }
        diskShort:
          type: string
          nullable: true
          description: >-
            Why the download disk can't take another download, in plain words (its free
            space, less what downloads in progress still need, is below the space kept free in
            Settings → Cleanup); null when there's room or it can't be told. While it's short,
            grabs are skipped and the hourly search waits.
        builtinState:
          type: string
          nullable: true
          enum: [unprotected, connecting, connected, down, held]
          description: "The built-in client's VPN state (see `GET /settings/download-client/builtin/status`) while it is the download client; null for the other clients. `connecting`, `down` and `held` mean its downloads are stopped."
        clientName: { type: string, description: "The download client's name, such as qBittorrent, for the page's wording. \"the download client\" when none is set up." }
        limit: { type: integer, description: The queue limit in Settings → Download Client (0 = no limit). }
        full: { type: boolean, description: Grabbing is On for movies or TV and the queue is at or over the limit, so nothing new is grabbed automatically (Seerr requests still go through). }
        clientError: { type: string, nullable: true, description: "Why the download client (or the Usenet client) couldn't be asked; the message names which. The list then shows only what Reelkeeper knows." }

    BlocklistItem:
      type: object
      required: [id, createdAt, movie, mediaType, episodes, releaseTitle, indexer, quality, reason, rule, expiresAt, permanent, dormant]
      properties:
        id: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        movie: { allOf: [{ $ref: "#/components/schemas/MovieRef" }], nullable: true, description: The movie or series; null if it's gone from Reelkeeper. }
        mediaType: { type: string, enum: [movie, series] }
        episodes: { type: string, description: 'For a TV release, the episodes it was grabbed for, when known; empty otherwise.' }
        releaseTitle: { type: string }
        indexer: { type: string }
        quality: { type: string }
        reason: { type: string, description: "Why it was blocked, in words." }
        rule: { type: string, description: "What blocked it: stalled, slow, metadata, missing, import-failed, unregistered (cleanup rules), removed (you removed it from the Queue), radarr or sonarr (brought over by an import), or cleanup (cleanup, rule not known)." }
        expiresAt: { type: string, format: date-time, nullable: true, description: When it stops blocking; null for a permanent entry. }
        permanent: { type: boolean }
        dormant: { type: boolean, description: The title has nothing wanted right now. }

    Blocklist:
      type: object
      required: [items, total, dormant, temporary]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/BlocklistItem" }
        total: { type: integer, description: Every entry that still blocks (for the title asked about, if any), listed or not. }
        dormant: { type: integer, description: How many of those are dormant. }
        temporary: { type: integer, description: How many of those will expire on their own (what unblock-temporary removes). }

    RadarrImportRequest:
      type: object
      required: [url, apiKey, profileId]
      properties:
        url: { type: string, description: "The Radarr's address, e.g. http://192.168.1.20:7979." }
        apiKey: { type: string, description: Radarr's API key. Used for the request only; never stored or logged. }
        profileId: { type: integer, format: int64, description: The movie quality profile its movies belong to in Reelkeeper. }

    RadarrImportIssue:
      type: object
      required: [tmdbId, title, year, kind, detail]
      properties:
        tmdbId: { type: integer }
        title: { type: string }
        year: { type: integer }
        kind:
          type: string
          enum: [missing-in-reelkeeper, quality-differs, other-file, only-in-reelkeeper, no-media-folder]
        detail: { type: string, description: Plain-English detail for this movie. }

    RadarrImportReport:
      type: object
      required: [instance, version, movies, withFile, monitored, wanted, toAdd, history, blocklist, issues, imported, added, monitorChanged, historyAdded, blocklistAdded]
      properties:
        instance: { type: string, description: "The Radarr's name, such as Radarr or Remux." }
        version: { type: string, description: "The Radarr's version." }
        movies: { type: integer, description: Movies in Radarr. }
        withFile: { type: integer, description: Movies with a file in Radarr. }
        monitored: { type: integer }
        wanted: { type: integer, description: Monitored movies without a file in Radarr. }
        toAdd: { type: integer, description: Movies not in this Reelkeeper profile yet. }
        history: { type: integer, description: History records Radarr has. }
        blocklist: { type: integer, description: Blocklist entries Radarr has. }
        issues:
          type: array
          items: { $ref: "#/components/schemas/RadarrImportIssue" }
        imported: { type: boolean, description: True when this is the result of an import rather than a preview. }
        added: { type: integer }
        monitorChanged: { type: integer }
        historyAdded: { type: integer }
        blocklistAdded: { type: integer }

    SonarrImportRequest:
      type: object
      required: [url, apiKey, profileId]
      properties:
        url: { type: string, description: "The Sonarr's address, e.g. http://192.168.1.20:8989." }
        apiKey: { type: string, description: Sonarr's API key. Used for the request only; never stored or logged. }
        profileId: { type: integer, format: int64, description: The TV quality profile its series belong to in Reelkeeper. }

    SonarrImportIssue:
      type: object
      required: [tmdbId, title, year, kind, detail]
      properties:
        tmdbId: { type: integer }
        title: { type: string }
        year: { type: integer }
        kind:
          type: string
          enum: [missing-in-reelkeeper, no-media-folder, only-in-reelkeeper, numbered-differently, unmatched-episodes, files-differ]
        detail: { type: string, description: Plain-English detail for this series. }

    SonarrWantedSeason:
      type: object
      required: [season, episodes]
      properties:
        season: { type: integer, description: The season number in Reelkeeper's order for the series. }
        episodes: { type: integer }

    SonarrWantedSeries:
      type: object
      required: [title, year, seasons]
      properties:
        title: { type: string }
        year: { type: integer }
        seasons:
          type: array
          items: { $ref: "#/components/schemas/SonarrWantedSeason" }

    SonarrImportReport:
      type: object
      required: [instance, version, series, toAdd, monitoredSeries, episodes, matched, matchedByDate, unmatched, newlyWanted, alreadyWanted, turnedOff, history, blocklist, wanted, issues, imported, added, monitorChanged, episodesTurnedOn, episodesTurnedOff, historyAdded, blocklistAdded]
      properties:
        instance: { type: string, description: "The Sonarr's name." }
        version: { type: string, description: "The Sonarr's version." }
        series: { type: integer, description: Series in Sonarr. }
        toAdd: { type: integer, description: Series not in this Reelkeeper profile yet. }
        monitoredSeries: { type: integer }
        episodes: { type: integer, description: Every episode Sonarr has. }
        matched: { type: integer, description: Episodes found in Reelkeeper by season and number. }
        matchedByDate: { type: integer, description: "Episodes found only by air date, because the two apps number them differently." }
        unmatched: { type: integer, description: "Episodes found neither way; their monitoring isn't brought over." }
        newlyWanted: { type: integer, description: "Episodes Sonarr monitors that have aired, that Reelkeeper has no file for and doesn't want yet. These are what Reelkeeper will start looking for." }
        alreadyWanted: { type: integer, description: "The same, but Reelkeeper already wants them." }
        turnedOff: { type: integer, description: "Matched episodes Reelkeeper wants and Sonarr doesn't monitor." }
        history: { type: integer, description: History records Sonarr has. }
        blocklist: { type: integer, description: Blocklist entries Sonarr has. }
        wanted:
          type: array
          description: The newly wanted episodes, by series (sorted by title) and season.
          items: { $ref: "#/components/schemas/SonarrWantedSeries" }
        issues:
          type: array
          items: { $ref: "#/components/schemas/SonarrImportIssue" }
        imported: { type: boolean, description: True when this is the result of an import rather than a preview. }
        added: { type: integer }
        monitorChanged: { type: integer }
        episodesTurnedOn: { type: integer }
        episodesTurnedOff: { type: integer }
        historyAdded: { type: integer }
        blocklistAdded: { type: integer }

    Backfill:
      type: object
      required: [next, decision, grabsToday, grabsPerDay]
      properties:
        now: { $ref: "#/components/schemas/BackfillShow" }
        next:
          type: array
          items: { $ref: "#/components/schemas/BackfillShow" }
        decision:
          type: array
          items: { $ref: "#/components/schemas/BackfillShow" }
        grabsToday: { type: integer, description: Grabs the show being worked on has had today. }
        grabsPerDay: { type: integer, description: Most grabs a day it gets. }

    BackfillShow:
      type: object
      required: [id, versionId, titleId, title, year, posterPath, state, found, missing, downloading]
      properties:
        id: { type: integer, format: int64, description: The queue entry's id. }
        versionId: { type: integer, format: int64 }
        titleId: { type: integer, format: int64 }
        title: { type: string }
        year: { type: integer }
        posterPath: { type: string }
        state: { type: string, enum: [queued, active, decision, done] }
        found: { type: integer, description: Aired episodes (specials left out) that have a file. }
        missing: { type: integer, description: "Aired episodes still wanted (those downloading included)." }
        downloading: { type: integer, description: Episodes on their way. }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }

    BackfillOptions:
      type: object
      required: [units, omitted]
      properties:
        units:
          type: array
          items: { $ref: "#/components/schemas/BackfillUnit" }
        omitted: { type: integer, description: Missing seasons or episodes left out to keep the search small. }

    BackfillUnit:
      type: object
      description: A missing season (searched as a pack) or a missing episode.
      required: [label, episodeIds, options]
      properties:
        label: { type: string, description: '"season 2", "S02E05" or a daily show''s date.' }
        episodeIds:
          type: array
          items: { type: integer, format: int64 }
        options:
          type: array
          items: { $ref: "#/components/schemas/BackfillOption" }

    BackfillOption:
      type: object
      required: [token, title, size, quality, indexer, seeders, reasons]
      properties:
        token: { type: string, description: Sent back to grab it. Valid for 15 minutes. }
        title: { type: string, description: The release name. }
        size: { type: integer, format: int64 }
        quality: { type: string }
        indexer: { type: string }
        seeders: { type: integer }
        usenet: { type: boolean, description: A Usenet release (it has no seeders). }
        reasons:
          type: array
          description: Why the profile turned it down, in plain English.
          items: { type: string }

    HistoryEventKind:
      type: string
      enum: [searched, rss, would-grab, grabbed, grab-skipped, imported, import-failed, removed, paused, resumed, moved-to-top, moved, move-failed, backfill, from-radarr, from-sonarr]

    HistoryVerdict:
      type: object
      description: The decision engine's view of one release.
      required: [name, indexer, size, seeders, quality, score, accepted]
      properties:
        name: { type: string }
        indexer: { type: string }
        size: { type: integer, format: int64 }
        seeders: { type: integer }
        quality: { type: string }
        score: { type: integer }
        formats:
          type: array
          items:
            type: object
            required: [name, score]
            properties:
              name: { type: string }
              score: { type: integer }
        accepted: { type: boolean }
        upgrade: { type: boolean }
        rejections:
          type: array
          items: { type: string }
        usenet: { type: boolean, description: A Usenet release (it has no seeders). }

    HistoryData:
      type: object
      properties:
        trigger: { type: string, description: 'What started a search: "manual", "added", "scheduled", "rss", "backfill", "picked" (a release the user chose) or "request" (Seerr asked for it).' }
        releases:
          type: array
          items: { $ref: "#/components/schemas/HistoryVerdict" }
        more: { type: integer, description: Releases found but not listed. }
        indexerErrors:
          type: array
          items: { type: string }
        chosen: { $ref: "#/components/schemas/HistoryVerdict" }

    HistoryEvent:
      type: object
      required: [id, createdAt, titleId, versionId, title, year, profile, event, sourceTitle, indexer, quality, score, message, data]
      properties:
        id: { type: integer, format: int64 }
        createdAt: { type: string, format: date-time }
        titleId: { type: integer, format: int64, nullable: true }
        versionId: { type: integer, format: int64, nullable: true }
        title: { type: string, nullable: true, description: The movie's or series' title, if it still exists. }
        year: { type: integer, nullable: true }
        mediaType: { type: string, enum: [movie, series], description: Which kind of title; absent when it no longer exists. }
        profile: { type: string, nullable: true, description: The quality profile of the version. }
        event: { $ref: "#/components/schemas/HistoryEventKind" }
        sourceTitle: { type: string }
        indexer: { type: string }
        quality: { type: string }
        score: { type: integer }
        message: { type: string }
        data: { $ref: "#/components/schemas/HistoryData" }

    HistoryPage:
      type: object
      required: [events, nextBefore]
      properties:
        events:
          type: array
          items: { $ref: "#/components/schemas/HistoryEvent" }
        nextBefore:
          type: integer
          format: int64
          nullable: true
          description: Pass as `before` to get the next page; null when there are no more.

    WantedList:
      type: object
      required: [missing, upgrades, counts]
      properties:
        missing:
          type: array
          items: { $ref: "#/components/schemas/WantedItem" }
        upgrades:
          type: array
          items: { $ref: "#/components/schemas/WantedItem" }
        counts: { $ref: "#/components/schemas/WantedCounts" }

    WantedCounts:
      type: object
      required: [missingMovies, missingEpisodes, upgrades]
      properties:
        missingMovies: { type: integer }
        missingEpisodes: { type: integer, description: Episodes, not groups. }
        upgrades: { type: integer }

    WantedItem:
      type: object
      description: >-
        A movie version, or one season's wanted episodes of a series version
        (an "episodes" item), with where its search stands.
      required: [kind, titleId, versionId, title, year, posterPath, profile, date, state, status, lastSearchMessage]
      properties:
        kind: { type: string, enum: [movie, episodes] }
        titleId: { type: integer, format: int64 }
        versionId: { type: integer, format: int64 }
        title: { type: string }
        year: { type: integer }
        posterPath: { type: string, description: TMDB poster path; empty when there is none. }
        profile: { type: string, description: The version's quality profile name. }
        date:
          type: string
          description: >-
            "YYYY-MM-DD". A movie: when it became available (digital or physical
            release, else TMDB's release date). Episodes: the newest air date in the group.
        state:
          type: string
          enum: [downloading, off, capped, noSpace, never, waiting]
          description: >-
            downloading: in the queue. off: grabbing is off. capped: the queue is
            full (the queue limit is reached). noSpace: the download disk is short of space, so
            searching waits until cleanup makes room. never: not searched yet. waiting: searched;
            the next search is due at `nextSearchAt`.
        status: { type: string, description: The state in plain English, with the next step. }
        lastSearchedAt: { type: string, format: date-time }
        lastSearchMessage:
          type: string
          description: The latest search's History message; empty if there is none (never searched, or pruned).
        nextSearchAt:
          type: string
          format: date-time
          description: When the scheduled search is next due; in the past means due now. Only for `waiting`.
        quality: { type: string, description: "Upgrades: the file's quality." }
        target: { type: string, description: "Upgrades: the profile's \"upgrade until\" quality." }
        score:
          type: integer
          description: >-
            Upgrades whose quality already reaches "upgrade until": the file's
            custom-format score. Absent for the others.
        targetScore:
          type: integer
          description: >-
            With `score`, the profile's "upgrade until" score. Absent when the
            profile has none (a simple profile stops at the quality, so only a
            file with a blocked format is listed, and `formats` names it).
        formats:
          type: array
          description: With `score`, the scored custom formats the file matches.
          items: { $ref: "#/components/schemas/TestReleaseFormat" }
        season: { type: integer, description: "Episodes: the season (in the series' chosen order)." }
        episodes:
          type: array
          items: { $ref: "#/components/schemas/WantedEpisode" }

    WantedEpisode:
      type: object
      required: [episodeId, season, number, name, airDate]
      properties:
        episodeId: { type: integer, format: int64 }
        season: { type: integer }
        number: { type: integer }
        name: { type: string }
        airDate: { type: string, description: '"YYYY-MM-DD".' }

    WantedSearchRequest:
      type: object
      required: [versionIds]
      properties:
        versionIds:
          type: array
          minItems: 1
          maxItems: 10
          description: At most 10, so one request doesn't flood the indexers (or a Cloudflare solver).
          items: { type: integer, format: int64 }

    WantedSearchResult:
      type: object
      required: [queued, alreadyQueued]
      properties:
        queued: { type: integer, description: Searches newly queued. }
        alreadyQueued: { type: integer, description: Versions that already had a search waiting or running. }

    MoviesBulkEdit:
      type: object
      required: [titleIds]
      description: Send at least one of monitored and upgrades; one that's left out is unchanged.
      properties:
        titleIds:
          type: array
          maxItems: 10000
          description: Movie ids.
          items: { type: integer, format: int64 }
        profileId:
          type: integer
          format: int64
          description: Change only the versions with this quality profile. Left out, every version is changed.
        monitored: { type: boolean }
        upgrades:
          type: boolean
          description: >-
            Whether Reelkeeper may replace the movies' files with better releases.
            Off: it keeps the files it has, but still downloads a movie again if its file is missing.

    SeriesBulkEdit:
      type: object
      required: [titleIds]
      description: Send at least one of monitored and monitor; one that's left out is unchanged.
      properties:
        titleIds:
          type: array
          maxItems: 10000
          description: Series ids.
          items: { type: integer, format: int64 }
        profileId:
          type: integer
          format: int64
          description: Change only the versions with this quality profile. Left out, every version is changed.
        monitored: { type: boolean }
        monitor:
          type: string
          enum: [all, future, none]
          description: >-
            all: every episode, aired or not. future: only episodes airing from
            today. none: nothing until turned on per season or episode.

    BulkEditResult:
      type: object
      required: [titles, versions, searched, later]
      properties:
        titles: { type: integer, description: Titles changed. }
        versions: { type: integer, description: Versions changed. }
        searched: { type: integer, description: Searches queued now (at most 10), run one after another. }
        later:
          type: integer
          description: Versions the change made wanted beyond the first 10; the hourly search finds them.

    WantedUnmonitorRequest:
      type: object
      properties:
        movies:
          type: array
          maxItems: 500
          description: Movie version ids.
          items: { type: integer, format: int64 }
        episodes:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/WantedUnmonitorEpisodes" }

    WantedUnmonitorEpisodes:
      type: object
      required: [versionId, episodeIds]
      properties:
        versionId: { type: integer, format: int64, description: A series version id. }
        episodeIds:
          type: array
          maxItems: 1000
          items: { type: integer, format: int64 }

    WantedUnmonitorResult:
      type: object
      required: [movies, episodes]
      properties:
        movies: { type: integer, description: Movie versions turned off. }
        episodes: { type: integer, description: Episodes turned off. }

    SolverSettings:
      type: object
      required: [url, timeoutSeconds]
      properties:
        url: { type: string, description: "The solver's address, e.g. http://trawl:8191. Empty: no solver." }
        timeoutSeconds: { type: integer, description: How long one page may take to solve (10-300). }

    SeriesType:
      type: string
      enum: [standard, daily]
      description: Standard series are named by season and episode; daily ones (talk and news shows) by air date.

    SeriesSummary:
      type: object
      required: [id, tmdbId, tvdbId, imdbId, title, sortTitle, year, status, network, seriesType, genres, posterPath,
                 seasons, airedEpisodes, problems, addedAt, versions]
      properties:
        id: { type: integer, format: int64 }
        tmdbId: { type: integer }
        tvdbId: { type: integer }
        imdbId: { type: string }
        title: { type: string }
        sortTitle: { type: string }
        year: { type: integer, description: The year it started. }
        status: { type: string, description: 'TMDB''s status: "Returning Series", "Ended", "Canceled"...' }
        network: { type: string }
        seriesType: { $ref: "#/components/schemas/SeriesType" }
        genres:
          type: array
          items: { type: string }
        posterPath: { type: string }
        seasons: { type: integer, description: Regular seasons (not counting Specials) in the chosen episode order. }
        airedEpisodes: { type: integer, description: Regular episodes that have aired. Compare with each version's episodesWithFiles. }
        problems: { type: integer, description: Files with a note (Reelkeeper isn't sure which episode they are). }
        addedAt: { type: string, format: date-time }
        versions:
          type: array
          items: { $ref: "#/components/schemas/VersionSummary" }

    SeriesDetail:
      type: object
      required: [id, tmdbId, tvdbId, imdbId, title, sortTitle, originalTitle, year, overview, runtime, status, network,
                 seriesType, genres, certification, firstAirDate, lastAirDate, posterPath, backdropPath, voteAverage,
                 episodeOrder, episodeOrderName, seasons, airedEpisodes, problems, addedAt, versions, seasonList, unordered]
      properties:
        id: { type: integer, format: int64 }
        tmdbId: { type: integer }
        tvdbId: { type: integer }
        imdbId: { type: string }
        title: { type: string }
        sortTitle: { type: string }
        originalTitle: { type: string }
        year: { type: integer }
        overview: { type: string }
        runtime: { type: integer, description: Typical episode length in minutes; 0 if unknown. }
        status: { type: string }
        network: { type: string }
        seriesType: { $ref: "#/components/schemas/SeriesType" }
        genres:
          type: array
          items: { type: string }
        certification: { type: string }
        firstAirDate: { type: string }
        lastAirDate: { type: string }
        posterPath: { type: string }
        backdropPath: { type: string }
        voteAverage: { type: number }
        episodeOrder: { type: string, description: Empty for TMDB's aired order, else the id of the chosen TMDB episode order. }
        episodeOrderName: { type: string, description: The chosen order's name; empty for TMDB's aired order. }
        seasons: { type: integer }
        airedEpisodes: { type: integer }
        problems: { type: integer }
        metadataUpdatedAt: { type: string, format: date-time }
        addedAt: { type: string, format: date-time }
        versions:
          type: array
          items: { $ref: "#/components/schemas/VersionDetail" }
        seasonList:
          type: array
          description: Seasons in the chosen order, regular ones first and Specials last.
          items: { $ref: "#/components/schemas/SeasonDetail" }
        unordered:
          type: array
          description: Episodes the chosen order leaves out (only with an order other than TMDB's aired one).
          items: { $ref: "#/components/schemas/EpisodeDetail" }

    SeasonDetail:
      type: object
      required: [number, name, overview, airDate, posterPath, episodes]
      properties:
        number: { type: integer, description: 0 is Specials. }
        name: { type: string }
        overview: { type: string }
        airDate: { type: string }
        posterPath: { type: string }
        episodes:
          type: array
          items: { $ref: "#/components/schemas/EpisodeDetail" }

    EpisodeDetail:
      type: object
      required: [id, tmdbId, airedSeason, airedNumber, title, overview, airDate, runtime, stillPath, episodeType, fileIds]
      properties:
        id: { type: integer, format: int64 }
        tmdbId: { type: integer }
        season: { type: integer, description: Its season in the chosen order; absent when the order leaves it out. }
        number: { type: integer, description: Its number in the chosen order; absent when the order leaves it out. }
        airedSeason: { type: integer, description: Its season in TMDB's aired order. }
        airedNumber: { type: integer }
        title: { type: string }
        overview: { type: string }
        airDate: { type: string, description: '"2020-02-07"; empty when not known yet.' }
        runtime: { type: integer }
        stillPath: { type: string }
        episodeType: { type: string, description: '"standard", "finale" or "mid_season".' }
        fileIds:
          type: array
          description: The media files holding this episode (ids from the versions' mediaFiles).
          items: { type: integer, format: int64 }

    EpisodeOrder:
      type: object
      required: [id, name, type, description, episodes, fits, problems, current]
      properties:
        id: { type: string, description: Empty for TMDB's aired order. }
        name: { type: string }
        type: { type: string, description: '"DVD", "Absolute", "Story arc"...; empty for the aired order.' }
        description: { type: string }
        episodes: { type: integer, description: Episodes this order places. }
        fits: { type: integer, description: Files that would be placed without a problem. }
        problems: { type: integer, description: Files that would get a note. }
        current: { type: boolean }

    AddSeries:
      type: object
      required: [tmdbId, profileId, rootFolderId]
      properties:
        tmdbId: { type: integer }
        profileId: { type: integer, format: int64 }
        rootFolderId: { type: integer, format: int64, description: A TV media folder. }
        monitored: { type: boolean, default: true }

    SeriesLookupResult:
      type: object
      required: [tmdbId, title, year, overview, posterPath, inLibrary]
      properties:
        tmdbId: { type: integer }
        title: { type: string }
        year: { type: integer }
        overview: { type: string }
        posterPath: { type: string }
        inLibrary: { type: boolean }
        seriesId:
          type: integer
          format: int64
          description: The library's ID, when it's already in the library.

    NamingSettings:
      type: object
      required: [movieFolder, movieFile, seriesFolder, seasonFolder, episodeFile, dailyEpisodeFile, multiEpisodeStyle]
      properties:
        movieFolder:
          type: string
          description: Template for a movie's folder, such as "{Movie Title} ({Release Year})".
        movieFile:
          type: string
          description: Template for a movie's file name, without the extension.
        seriesFolder:
          type: string
          description: Template for a series' folder, such as "{Series TitleYear} {tvdb-{TvdbId}}".
        seasonFolder:
          type: string
          description: Template for a season's folder, such as "Season {season}". Specials always go in "Specials".
        episodeFile:
          type: string
          description: Template for an episode's file name, without the extension, in Sonarr's syntax.
        dailyEpisodeFile:
          type: string
          description: Template for a daily show's episode file name, usually with {Air-Date}.
        multiEpisodeStyle: { $ref: "#/components/schemas/MultiEpisodeStyle" }

    MultiEpisodeStyle:
      type: string
      enum: [prefixed-range, range, extend, scene, repeat, duplicate]
      description: |
        How a file holding several episodes writes them, for episodes 1-3:
        prefixed-range S01E01-E03, range S01E01-03, extend S01E01-02-03,
        scene S01E01-E02-E03, repeat S01E01E02E03, duplicate
        S01E01.S01E02.S01E03.

    LabelPart:
      type: string
      description: |
        One piece of a quality label. Labels show the chosen parts in this
        order: profile ("Remux"), quality ("Bluray-2160p"), hdr ("DV · HDR10"),
        videoCodec ("H.265"), audio ("TrueHD 7.1"), releaseGroup, edition, size.
      enum: [profile, quality, hdr, videoCodec, audio, releaseGroup, edition, size]

    LabelSettings:
      type: object
      required: [parts]
      properties:
        parts:
          type: array
          items: { $ref: "#/components/schemas/LabelPart" }
          description: Empty means labels appear only for warnings, such as missing files.

    NamingPreview:
      type: object
      required: [examples, episodeExamples, problems]
      properties:
        examples:
          type: array
          items: { $ref: "#/components/schemas/NamingExample" }
        episodeExamples:
          type: array
          items: { $ref: "#/components/schemas/NamingExample" }
          description: Sample episodes; folder is "<series folder>/<season folder>".
        problems:
          type: object
          description: A problem per template, keyed by the NamingSettings field. Empty when all are fine.
          additionalProperties: { type: string }

    NamingExample:
      type: object
      required: [label, folder, file]
      properties:
        label: { type: string }
        folder: { type: string }
        file: { type: string, description: With the extension. }

    RenamePair:
      type: object
      required: [from, to]
      properties:
        from: { type: string }
        to: { type: string }

    VersionRename:
      type: object
      required: [versionId, profileName, rootPath, managed, files]
      properties:
        versionId: { type: integer, format: int64 }
        profileName: { type: string }
        rootPath: { type: string }
        managed:
          type: boolean
          description: False when "Reelkeeper manages files here" is off for this media folder; nothing is renamed then.
        files:
          type: array
          items: { $ref: "#/components/schemas/FileRename" }

    FileRename:
      type: object
      required: [fileId, from, to, extras, problem, done]
      properties:
        fileId: { type: integer, format: int64 }
        from: { type: string, description: Relative to the media folder. }
        to: { type: string }
        extras:
          type: array
          description: Subtitles and other files with the same name, renamed along with the video.
          items: { $ref: "#/components/schemas/RenamePair" }
        problem: { type: string, description: Why it can't be (or wasn't fully) renamed. Empty if fine. }
        done: { type: boolean }

    CheckResult:
      type: object
      required: [ok, message]
      properties:
        ok: { type: boolean }
        message:
          type: string
          description: Plain-English result, such as what went wrong.

    SystemStatus:
      type: object
      required: [version, goVersion, os, arch, startedAt, uptimeSeconds, urlBase, dataDir, database, memory]
      properties:
        version: { type: string }
        goVersion: { type: string }
        os: { type: string }
        arch: { type: string }
        startedAt: { type: string, format: date-time }
        uptimeSeconds: { type: integer, format: int64 }
        urlBase: { type: string }
        dataDir: { type: string }
        database:
          type: object
          required: [engine, schemaVersion]
          properties:
            engine:
              type: string
              enum: [sqlite, postgres]
            schemaVersion: { type: integer, format: int64 }
        memory:
          type: object
          required: [heapBytes, totalBytes]
          properties:
            heapBytes:
              type: integer
              format: int64
              description: Memory in use by Reelkeeper's data.
            totalBytes:
              type: integer
              format: int64
              description: Memory obtained from the operating system, roughly what the container uses.

    EventType:
      type: string
      enum: [settings.changed, session.ended, task.updated, library.changed, notice]
      description: |
        settings.changed: a settings group was saved (data: { "group": "general" }).
        session.ended: this browser's session was ended elsewhere; the UI goes to the login page.
        task.updated: a background task run changed (data: a Job).
        library.changed: movies, files or review items changed (data: {}).
        notice: something worth a pop-up happened (data: { kind, title, message, problem }); the UI shows `message`, with a warning look when `problem` is true.

    JobStatus:
      type: string
      enum: [queued, running, succeeded, failed, cancelled]

    Job:
      type: object
      description: One run of a background task.
      required: [id, kind, name, status, trigger, progress, message, error, attempts, quiet, createdAt]
      properties:
        id: { type: integer, format: int64 }
        kind: { type: string, description: "Stable task identifier, such as library.scan." }
        name: { type: string, description: The task's plain-English name. }
        status: { $ref: "#/components/schemas/JobStatus" }
        trigger:
          type: string
          enum: [manual, schedule, system, api]
          description: 'Who started it: "api" is another app (such as Seerr) through the Radarr/Sonarr-compatible API.'
        progress: { type: integer, minimum: 0, maximum: 100 }
        message: { type: string, description: What it is doing or did, in plain words. }
        error: { type: string, description: Why it failed, when it failed. }
        attempts: { type: integer, description: Runs so far; above 1 means it restarted after an interruption. }
        quiet:
          type: boolean
          description: A routine run that found nothing to do. Never true for a run started by hand.
        createdAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: string, format: date-time }

    Task:
      type: object
      required: [kind, name, description, everySeconds]
      properties:
        kind: { type: string }
        name: { type: string }
        description: { type: string }
        everySeconds:
          type: integer
          format: int64
          description: How often it runs on its own; 0 means only when started by hand or by Reelkeeper.
        nextRunAt:
          type: string
          format: date-time
          description: When its schedule starts it next. Absent if unscheduled or already queued or running.
        last: { $ref: "#/components/schemas/Job" }
        active: { $ref: "#/components/schemas/Job" }

    TasksOverview:
      type: object
      required: [tasks, recent, hiddenRoutine]
      properties:
        tasks:
          type: array
          items: { $ref: "#/components/schemas/Task" }
        recent:
          type: array
          description: The latest runs of any task, newest first. Routine runs are left out unless asked for.
          items: { $ref: "#/components/schemas/Job" }
        hiddenRoutine:
          type: integer
          description: How many routine runs that found nothing to do were left out of `recent` (newer than its oldest entry). Always 0 with `routine=true`.

    MetadataSettings:
      type: object
      required: [tmdbApiKeySet, language]
      properties:
        tmdbApiKeySet:
          type: boolean
          description: Whether a TMDB key is stored. The key itself is never returned.
        language:
          type: string
          description: Language for titles and overviews, such as en-US.

    MetadataSettingsUpdate:
      type: object
      required: [language]
      properties:
        tmdbApiKey:
          type: string
          format: password
          description: Leave out to keep the stored key; an empty string removes it.
        language: { type: string }

    Profile:
      type: object
      required: [id, name, slug, appliesTo, mediaFolders, movies, series]
      properties:
        id: { type: integer, format: int64 }
        name: { type: string }
        slug: { type: string, description: Set when the profile is created and never changes. }
        appliesTo: { type: string, enum: [movie, series, both] }
        mediaFolders: { type: integer, description: Media folders that use this profile. }
        movies: { type: integer, description: Movie versions that use this profile. }
        series: { type: integer, description: Series versions that use this profile. }

    ProfileInput:
      type: object
      required: [name, appliesTo]
      properties:
        name: { type: string, description: Up to 40 characters; unique ignoring case. }
        appliesTo: { type: string, enum: [movie, series, both] }
        preset:
          type: string
          description: Only when adding. The preset (see `/profiles/options`) whose settings the new profile starts from. Default `hd`.

    ProfileChoice:
      type: string
      enum: [prefer, avoid, require, block]
      description: What a profile thinks of a feature. Leaving a feature out means "don't care".

    ProfileRung:
      type: object
      required: [resolution, source]
      properties:
        resolution: { type: integer, description: "480, 720, 1080 or 2160." }
        source: { type: string, description: A source tier id from `/profiles/options` (`tiers`). }

    ProfileSizeRange:
      type: object
      required: [min, max]
      properties:
        min: { type: number, format: double, description: GB per hour of runtime; 0 for no minimum. }
        max: { type: number, format: double, description: GB per hour of runtime; 0 for no maximum. }

    ProfileLanguages:
      type: object
      required: [mode]
      properties:
        mode: { type: string, enum: [any, original, list] }
        list: { type: array, items: { type: string }, description: Language names, for mode `list`. }

    ProfileSimple:
      type: object
      description: A profile as the simple editor shows it.
      required: [resolutions, lowestSource, highestSource, webEqual, upgrades, upgradeUntil, preferPropers, languages]
      properties:
        resolutions: { type: array, items: { type: integer } }
        lowestSource: { type: string }
        highestSource: { type: string }
        webEqual: { type: boolean }
        upgrades: { type: boolean }
        upgradeUntil: { $ref: "#/components/schemas/ProfileRung" }
        preferPropers: { type: boolean }
        sizes:
          type: object
          description: Size limits per resolution (keys "480", "720", "1080", "2160").
          additionalProperties: { $ref: "#/components/schemas/ProfileSizeRange" }
        languages: { $ref: "#/components/schemas/ProfileLanguages" }
        preferGroups: { type: array, items: { type: string } }
        blockGroups: { type: array, items: { type: string } }
        features:
          type: object
          description: Feature id to choice.
          additionalProperties: { $ref: "#/components/schemas/ProfileChoice" }

    ProfileQualityItem:
      type: object
      required: [name, allowed]
      properties:
        name: { type: string }
        qualities: { type: array, items: { type: string }, description: Members, when the item is a group. }
        allowed: { type: boolean }

    ProfileSizeLimit:
      type: object
      required: [min, max]
      properties:
        min: { type: number, format: double, description: MB per minute of runtime; 0 for no minimum. }
        max: { type: number, format: double, description: MB per minute of runtime; 0 for no maximum. }

    CustomFormatSpec:
      type: object
      required: [name, implementation, negate, required, fields]
      properties:
        name: { type: string }
        implementation: { type: string, description: "Radarr's condition kind, such as ReleaseTitleSpecification." }
        negate: { type: boolean }
        required: { type: boolean }
        fields: { type: object, additionalProperties: true, description: The condition's settings (Radarr's field values). }

    CustomFormat:
      type: object
      description: A custom format in Radarr / TRaSH Guides JSON.
      required: [name, specifications]
      properties:
        name: { type: string }
        includeCustomFormatWhenRenaming: { type: boolean }
        specifications: { type: array, items: { $ref: "#/components/schemas/CustomFormatSpec" } }

    ProfileRequirement:
      type: object
      required: [label, anyOf]
      properties:
        label: { type: string }
        anyOf: { type: array, items: { type: string }, description: Custom format names; matching one is enough. }

    ProfileCompiled:
      type: object
      description: A profile in its compiled (advanced) form, as Radarr models it.
      required: [items, upgradesAllowed, upgradeUntil, upgradeUntilScore, minUpgradeStep, formats, scores, minScore, preferPropers]
      properties:
        items: { type: array, items: { $ref: "#/components/schemas/ProfileQualityItem" }, description: Worst first. }
        upgradesAllowed: { type: boolean }
        upgradeUntil: { type: string, description: Name of an item. }
        upgradeUntilScore: { type: integer }
        minUpgradeStep: { type: integer }
        formats: { type: array, items: { $ref: "#/components/schemas/CustomFormat" } }
        scores: { type: object, additionalProperties: { type: integer }, description: Score per custom format name. }
        minScore: { type: integer }
        required: { type: array, items: { $ref: "#/components/schemas/ProfileRequirement" } }
        sizes: { type: object, additionalProperties: { $ref: "#/components/schemas/ProfileSizeLimit" }, description: Per quality name. }
        preferPropers: { type: boolean }

    ProfileSettings:
      type: object
      required: [mode, simple, compiled]
      properties:
        mode: { type: string, enum: [simple, advanced] }
        simple: { $ref: "#/components/schemas/ProfileSimple" }
        compiled: { $ref: "#/components/schemas/ProfileCompiled" }

    ProfilePreset:
      type: object
      required: [id, name, description, settings]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        settings: { $ref: "#/components/schemas/ProfileSimple" }

    ProfileFeature:
      type: object
      required: [id, label, group, canRequire]
      properties:
        id: { type: string }
        label: { type: string }
        group: { type: string, description: "picture, sound, release or edition." }
        help: { type: string }
        canRequire: { type: boolean }

    ProfileTier:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }

    ProfileResolution:
      type: object
      required: [value, label]
      properties:
        value: { type: integer }
        label: { type: string }

    ProfileOptions:
      type: object
      required: [presets, features, tiers, resolutions, languages, qualities, choices]
      properties:
        presets: { type: array, items: { $ref: "#/components/schemas/ProfilePreset" } }
        features: { type: array, items: { $ref: "#/components/schemas/ProfileFeature" } }
        tiers: { type: array, items: { $ref: "#/components/schemas/ProfileTier" }, description: The source ladder, worst first. }
        resolutions: { type: array, items: { $ref: "#/components/schemas/ProfileResolution" } }
        languages: { type: array, items: { type: string }, description: English first, then alphabetical. }
        qualities: { type: array, items: { type: string }, description: Every quality name, worst first. }
        choices: { type: array, items: { $ref: "#/components/schemas/ProfileChoice" } }

    TestReleaseInput:
      type: object
      required: [name]
      properties:
        name: { type: string, description: A release name, such as `Some.Movie.2021.1080p.BluRay.x264-GRP`. }
        sizeGB: { type: number, format: double, description: The release's size, to check size limits. }
        runtimeMinutes: { type: integer, description: The movie's length for size limits. Default 120. }
        originalLanguage: { type: string, description: "The movie's original language, as a language name. Default English." }

    TestReleaseParsed:
      type: object
      required: [title, year, resolution, source, group, edition, languages, hdr, audio, videoCodec, revision]
      properties:
        title: { type: string }
        year: { type: integer }
        resolution: { type: integer }
        source: { type: string }
        group: { type: string }
        edition: { type: string }
        languages: { type: array, items: { type: string } }
        hdr: { type: array, items: { type: string } }
        audio: { type: array, items: { type: string } }
        videoCodec: { type: string }
        revision: { type: integer }

    TestReleaseFormat:
      type: object
      required: [name, score]
      properties:
        name: { type: string }
        score: { type: integer }

    TestReleaseResult:
      type: object
      required: [accepted, rejections, quality, score, formats, upgrade, parsed]
      properties:
        accepted: { type: boolean }
        rejections: { type: array, items: { type: string }, description: Why not, in plain words. }
        quality: { type: string }
        score: { type: integer }
        formats: { type: array, items: { $ref: "#/components/schemas/TestReleaseFormat" } }
        upgrade: { type: boolean }
        parsed: { $ref: "#/components/schemas/TestReleaseParsed" }

    RootFolder:
      type: object
      required: [id, path, mediaType, defaultProfileId, manageFiles, upgradeFound, titles, files, missing, review, size, freeSpace]
      properties:
        id: { type: integer, format: int64 }
        path: { type: string }
        mediaType: { type: string, enum: [movie, series] }
        defaultProfileId:
          type: integer
          format: int64
          description: Movies found here become this profile's version.
        manageFiles:
          type: boolean
          description: |
            Whether Reelkeeper may rename, move or delete files here. Off while
            another app (Radarr) still manages the folder; Reelkeeper then only reads it.
        upgradeFound:
          type: boolean
          description: |
            Movie folders: whether movies found here (already on disk, or imported from
            Radarr) are upgraded when a better release turns up. Each movie can still be
            switched on or off on its own page. Always true for series folders, which ignore it.
        lastScanAt: { type: string, format: date-time }
        titles: { type: integer }
        files: { type: integer }
        missing: { type: integer, description: Files that were here and aren't any more. }
        review: { type: integer, description: Folders waiting in the review screen. }
        size: { type: integer, format: int64, description: Total size of the files, in bytes. }
        freeSpace: { type: integer, format: int64, description: Free space on the disk, in bytes; -1 if unknown. }

    RootFolderInput:
      type: object
      required: [path, mediaType, defaultProfileId]
      properties:
        path: { type: string }
        mediaType: { type: string, enum: [movie, series] }
        defaultProfileId: { type: integer, format: int64 }
        upgradeFound:
          type: boolean
          description: >-
            Movie folders: whether movies found here are upgraded. Off when left out so adding
            a large library doesn't queue an upgrade search for every movie.

    RootFolderUpdate:
      type: object
      required: [defaultProfileId, manageFiles]
      properties:
        defaultProfileId: { type: integer, format: int64 }
        manageFiles: { type: boolean }
        upgradeFound:
          type: boolean
          description: >-
            Movie folders: turn upgrades on or off for every movie in the folder, including
            ones Reelkeeper downloaded. Left out: unchanged. Turning it on doesn't start
            searches; the scheduled pass picks the movies up at its usual pace.

    FolderListing:
      type: object
      required: [path, folders]
      properties:
        path: { type: string }
        parent: { type: string, description: The folder above, if any. }
        folders:
          type: array
          items:
            type: object
            required: [name, path]
            properties:
              name: { type: string }
              path: { type: string }

    Candidate:
      type: object
      required: [tmdbId, title, year, overview, posterPath, score]
      properties:
        tmdbId: { type: integer }
        title: { type: string }
        year: { type: integer }
        overview: { type: string }
        posterPath: { type: string }
        score: { type: number, description: How well it fits the folder name, 0-1. }

    ReviewItem:
      type: object
      required: [id, rootFolderId, rootPath, mediaType, path, titleGuess, yearGuess, reason, candidates, files]
      properties:
        id: { type: integer, format: int64 }
        rootFolderId: { type: integer, format: int64 }
        rootPath: { type: string }
        mediaType:
          type: string
          enum: [movie, series]
          description: The media folder's type. For series, candidates and the tmdbId to resolve with are TMDB series IDs.
        path: { type: string, description: The folder (or file) below the root. }
        titleGuess: { type: string }
        yearGuess: { type: integer }
        reason: { type: string, description: Why Reelkeeper isn't sure, in plain words. }
        candidates:
          type: array
          items: { $ref: "#/components/schemas/Candidate" }
        files:
          type: array
          items: { type: string }

    VersionSummary:
      type: object
      required: [id, profileId, profileName, rootFolderId, rootPath, folder, monitored, upgrades, files, missing, size, quality, resolution, hdr, videoCodec, audioCodec, audioChannels, releaseGroup, edition, episodesWithFiles]
      properties:
        id: { type: integer, format: int64 }
        profileId: { type: integer, format: int64 }
        profileName: { type: string }
        rootFolderId: { type: integer, format: int64 }
        rootPath: { type: string }
        folder: { type: string }
        monitored: { type: boolean }
        upgrades:
          type: boolean
          description: "Movies only: whether Reelkeeper may replace the file with a better release. Series versions are always true."
        files: { type: integer, description: Video files on disk (not counting missing ones). }
        missing: { type: integer }
        size: { type: integer, format: int64 }
        quality: { type: string, description: 'The best file''s quality, e.g. "Bluray-2160p".' }
        resolution: { type: integer }
        hdr:
          type: array
          items: { type: string }
        videoCodec: { type: string, description: 'The best file''s video codec, e.g. "H.265"; empty if unknown.' }
        audioCodec: { type: string, description: 'The best file''s first audio track, e.g. "TrueHD"; empty if unknown.' }
        audioChannels: { type: integer, description: Channels of that audio track; 0 if unknown. }
        releaseGroup: { type: string, description: 'The best file''s release group.' }
        edition: { type: string, description: 'The best file''s edition, e.g. "Director''s Cut".' }
        episodesWithFiles: { type: integer, description: Series only; regular episodes with at least one present file in this version. 0 for movies. }

    MovieSummary:
      type: object
      required: [id, tmdbId, imdbId, title, sortTitle, year, runtime, genres, posterPath, addedAt, versions]
      properties:
        id: { type: integer, format: int64 }
        tmdbId: { type: integer }
        imdbId: { type: string }
        title: { type: string }
        sortTitle: { type: string }
        year: { type: integer }
        runtime: { type: integer, description: Minutes. }
        genres:
          type: array
          items: { type: string }
        posterPath: { type: string, description: "TMDB image path; load it from /images/tmdb/<size><posterPath>." }
        addedAt: { type: string, format: date-time }
        versions:
          type: array
          items: { $ref: "#/components/schemas/VersionSummary" }

    MediaVideo:
      type: object
      required: [codec, width, height]
      properties:
        codec: { type: string }
        width: { type: integer }
        height: { type: integer }
        bitDepth: { type: integer }
        hdr:
          type: array
          items: { type: string }
        dvProfile: { type: integer }

    MediaAudio:
      type: object
      required: [codec]
      properties:
        codec: { type: string }
        channels: { type: integer }
        language: { type: string }
        title: { type: string }
        default: { type: boolean }

    MediaSubtitle:
      type: object
      required: [codec]
      properties:
        codec: { type: string }
        language: { type: string }
        title: { type: string }
        forced: { type: boolean }

    MediaFile:
      type: object
      required: [id, path, size, quality, resolution, source, edition, releaseGroup, audio, subtitles, durationSeconds, addedAt]
      properties:
        id: { type: integer, format: int64 }
        path: { type: string, description: Full path, as Reelkeeper sees it. }
        size: { type: integer, format: int64 }
        quality: { type: string }
        resolution: { type: integer }
        source: { type: string }
        edition: { type: string }
        releaseGroup: { type: string }
        video: { $ref: "#/components/schemas/MediaVideo" }
        audio:
          type: array
          items: { $ref: "#/components/schemas/MediaAudio" }
        subtitles:
          type: array
          items: { $ref: "#/components/schemas/MediaSubtitle" }
        durationSeconds: { type: integer }
        probeError: { type: string, description: Why the file's details couldn't be read, if they couldn't. }
        missingSince: { type: string, format: date-time }
        addedAt: { type: string, format: date-time }
        matchNote:
          type: string
          description: Episodes only. Why Reelkeeper isn't sure which episode this file is, in plain words; empty when all is well.

    VersionDetail:
      allOf:
        - { $ref: "#/components/schemas/VersionSummary" }
        - type: object
          required: [mediaFiles]
          properties:
            mediaFiles:
              type: array
              items: { $ref: "#/components/schemas/MediaFile" }
            monitor:
              type: string
              enum: [all, future, none]
              description: >-
                Series only: the version's monitoring preset. "future" counts from
                monitorFrom. Seasons and episodes can be turned on or off on top
                of it (see episodes).
            monitorFrom:
              type: string
              description: 'Series only, with "future": episodes airing on or after this date ("2026-10-11") are wanted.'
            episodes:
              type: array
              description: Series only. Every episode's state in this version.
              items: { $ref: "#/components/schemas/EpisodeState" }

    EpisodeState:
      type: object
      required: [episodeId, monitored, state]
      properties:
        episodeId: { type: integer, format: int64 }
        monitored: { type: boolean }
        state:
          type: string
          enum: [has-file, downloading, wanted, not-aired, unmonitored]
          description: >-
            has-file: a file is present (TV doesn't upgrade, so nothing more is
            searched for). downloading: in the queue. wanted: monitored and aired,
            no file yet. not-aired: monitored, airs later (or its date isn't known
            yet). unmonitored: not monitored and no file.

    MovieDetail:
      type: object
      required: [id, tmdbId, imdbId, title, originalTitle, year, overview, runtime, genres, certification, collection,
                 releaseDate, theatricalRelease, digitalRelease, physicalRelease, posterPath, backdropPath, voteAverage,
                 addedAt, versions]
      properties:
        id: { type: integer, format: int64 }
        tmdbId: { type: integer }
        imdbId: { type: string }
        title: { type: string }
        originalTitle: { type: string }
        year: { type: integer }
        overview: { type: string }
        runtime: { type: integer }
        genres:
          type: array
          items: { type: string }
        certification: { type: string }
        collection: { type: string }
        releaseDate: { type: string }
        theatricalRelease: { type: string }
        digitalRelease: { type: string }
        physicalRelease: { type: string }
        posterPath: { type: string }
        backdropPath: { type: string }
        voteAverage: { type: number }
        metadataUpdatedAt: { type: string, format: date-time }
        addedAt: { type: string, format: date-time }
        versions:
          type: array
          items: { $ref: "#/components/schemas/VersionDetail" }

    DeleteMovieResult:
      type: object
      required: [deleted, skipped]
      properties:
        deleted:
          type: array
          items: { type: string }
          description: Files and folders removed from disk.
        skipped:
          type: array
          items: { type: string }
          description: Folders scans will now leave alone.

    SkippedFolder:
      type: object
      required: [id, rootFolderId, rootPath, path, title, createdAt]
      properties:
        id: { type: integer, format: int64 }
        rootFolderId: { type: integer, format: int64 }
        rootPath: { type: string, description: The media folder it is in. }
        path: { type: string, description: The folder's name inside the media folder. }
        title: { type: string, description: What it was, e.g. "Dune (2021)". }
        createdAt: { type: string, format: date-time }

    AddMovie:
      type: object
      required: [tmdbId, profileId, rootFolderId]
      properties:
        tmdbId: { type: integer }
        profileId: { type: integer, format: int64 }
        rootFolderId: { type: integer, format: int64 }
        monitored: { type: boolean, default: true }

    LookupResult:
      type: object
      required: [tmdbId, title, year, overview, posterPath, inLibrary]
      properties:
        tmdbId: { type: integer }
        title: { type: string }
        year: { type: integer }
        overview: { type: string }
        posterPath: { type: string }
        inLibrary: { type: boolean }
        movieId:
          type: integer
          format: int64
          description: The library's ID, when it's already in the library.

    Event:
      type: object
      required: [type, data]
      properties:
        type: { $ref: "#/components/schemas/EventType" }
        data:
          type: object
          additionalProperties: true
