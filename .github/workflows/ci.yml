# Continuous integration on GitHub: the same checks as .forgejo/workflows/ci.yml,
# on GitHub-hosted runners (no shared /cache volume; the setup actions cache
# instead).
#
# Every push to main and every pull request: lint, a check that generated code
# is up to date, tests on SQLite and Postgres, and a full build. The release
# workflow calls this one first (workflow_call), so a tag is never built from
# code that failed the checks.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

env:
  GOLANGCI_LINT_VERSION: v2.14.0
  JUST_VERSION: 1.58.0

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: reelkeeper
          POSTGRES_PASSWORD: reelkeeper
          POSTGRES_DB: reelkeeper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reelkeeper -d reelkeeper"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3.1.0
        with:
          just-version: ${{ env.JUST_VERSION }}

      # Installs golangci-lint only; `just lint` runs it (and Biome and tsc).
      - uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true

      - name: Lint
        run: just lint

      - name: Generated code is up to date
        run: |
          just gen
          git diff --exit-code -- internal/api/gen web/src/api \
            || (echo "Run 'just gen' and commit the result." && exit 1)

      - name: Tests (SQLite, plus frontend)
        run: just test

      - name: Tests (Postgres)
        env:
          REELKEEPER_TEST_POSTGRES: postgres://reelkeeper:reelkeeper@localhost:5432/reelkeeper?sslmode=disable
        run: go test -race ./...

      - name: Build
        run: just build
